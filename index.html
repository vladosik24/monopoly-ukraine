<script>
const FB={apiKey:"AIzaSyBQNVeXBCqQi5eKhfjAQTJivwKzT9gXT0k",authDomain:"monopoly-fc387.firebaseapp.com",databaseURL:"https://monopoly-fc387-default-rtdb.firebaseio.com",projectId:"monopoly-fc387",storageBucket:"monopoly-fc387.firebasestorage.app",messagingSenderId:"748860996691",appId:"1:748860996691:web:7ae524502e9dc368991aa6"};
firebase.initializeApp(FB);const db=firebase.database();
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const tu=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
const MY_ID=tu?String(tu.id):(localStorage.mono_gid||(localStorage.mono_gid='g'+Math.random().toString(36).slice(2,9)));
const MY_NAME=tu?tu.first_name+(tu.last_name?' '+tu.last_name:''):'Гравець',MY_AV=tu&&tu.photo_url||null;
const $=id=>document.getElementById(id),A=x=>x||[],esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const e=$('ts');e.textContent=m;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
function show(id){['lobby','wait','game'].forEach(s=>$(s).classList.toggle('hid',s!=id))}

/* ---- ДАНІ ПОЛЯ: структура одна, різні назви ---- */
const GCOL=['#8B4A2B','#8FCBEB','#D6539E','#E8892B','#D6403B','#F0D93B','#2E9E5B','#1D3E6E'],HC=[50,50,100,100,150,150,200,200];
const LAY="g;p60,4,0;c;p60,4,0;t200;r;p100,6,1;h;p100,6,1;p120,8,1;j;p140,10,2;u;p140,10,2;p160,12,2;r;p180,14,3;c;p180,14,3;p200,16,3;k;p220,18,4;h;p220,18,4;p240,20,4;r;p260,22,5;p260,22,5;u;p280,24,5;J;p300,26,6;p300,26,6;c;p320,28,6;r;h;p350,35,7;t100;p400,50,7";
const MAPS={brands:"СТАРТ|Моршинська|Казна|Живчик|Податок|Нова Пошта|Prom|Шанс|OLX|Rozetka|В'язниця|ATB|DTEK|Сільпо|Епіцентр|Укрпошта|Oschadbank|Казна|Raiffeisen|monobank|Парковка|PrivatBank|Шанс|McDonald's|KFC|Meest|Burger King|Metro|Kyivstar|Samsung|До в'язниці|adidas|Nike|Казна|Puma|Justin|Шанс|Google|Розкіш|Apple",ua:"СТАРТ|Бердичів|Казна|Ізмаїл|Податок|Вокзал Пн|Тернопіль|Шанс|Рівне|Луцьк|В'язниця|Хмельницький|Водоканал|Вінниця|Житомир|Вокзал Сх|Черкаси|Казна|Кропивницький|Суми|Парковка|Чернігів|Шанс|Полтава|Кременчук|Вокзал Пд|Запоріжжя|Миколаїв|Енергозбут|Херсон|До в'язниці|Івано-Франківськ|Чернівці|Казна|Ужгород|Вокзал Зх|Шанс|Львів|Розкіш|Київ",
fruit:"СТАРТ|Лимон|Кошик|Лайм|Мито|Візок Пн|Полуниця|Шанс|Малина|Ожина|Черга|Ківі|Сік-бар|Манго|Папая|Візок Сх|Диня|Кошик|Гарбуз|Кавун|Пікнік|Вишня|Шанс|Черешня|Слива|Візок Пд|Банан|Ананас|Смузі|Кокос|На ринок|Виноград|Гранат|Кошик|Інжир|Візок Зх|Шанс|Персик|Делікатес|Золотий ананас"};
const MN={brands:'🏷️ Бренди',ua:'🏙️ Українська',fruit:'🍉 Фруктова'};
const ICO={g:'🏁',j:'⛓️',k:'🅿️',J:'👮',h:'❓',c:'📦',t:'💸',r:'🚂',u:'🔧'};
let B=[],curMap=null;
function mk(id){const nm=MAPS[id].split('|');B=LAY.split(';').map((s,i)=>{const t=s[0],n=s.slice(1).split(',').map(Number),c={t,n:nm[i],i};
 if(t=='p'){c.p=n[0];c.r=n[1];c.g=n[2]}else if(t=='r')c.p=200;else if(t=='u')c.p=150;else if(t=='t')c.a=n[0];return c})}
const CH=[["Банк помилково нарахував 200₴",'m',200],["Штраф за швидкість: 50₴",'m',-50],["На СТАРТ! +200₴",'g'],["До в'язниці!",'j'],["Карта «Звільнення з в'язниці»",'f'],["Ремонт доріг: -100₴",'m',-100],["Виграш у конкурсі +100₴",'m',100],["Їдьте на Вокзал Сх",'v',15]];
const CC=[["Повернення податків +20₴",'m',20],["Лікарня: -100₴",'m',-100],["Продаж акцій +50₴",'m',50],["Спадщина +100₴",'m',100],["Навчання: -150₴",'m',-150],["Карта «Звільнення з в'язниці»",'f'],["День народження! +10₴ від кожного",'a',10],["До в'язниці!",'j']];
const COLORS=["#E63946","#457B9D","#2A9D8F","#F4A261","#9B5DE5","#F72585","#4CC9F0","#FFD166"];

/* ---- СТАН ---- */
let room=null,game=null,roomRef=null,logRef=null,lock=0,bf=null,lastRoll=null,logs=[];
const H=(p,i)=>(p.houses||{})['h'+i]||0;
const owner=(g,i)=>Object.keys(g.players).find(k=>A(g.players[k].props).includes(i))||null;
function snap(){const g=JSON.parse(JSON.stringify(game));for(const k in g.players){const p=g.players[k];p.props=A(p.props);p.houses=p.houses||{};p.mortgaged=A(p.mortgaged)}return g}
const newP=(o)=>({name:MY_NAME,order:o,pos:0,balance:1500,props:[],houses:{},mortgaged:[],inJail:false,jailTurns:0,jailFree:false,bankrupt:false,color:COLORS[o%8],avatar:MY_AV});
const genCode=()=>Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.random()*24|0]).join('');

/* ---- ЛОБІ ---- */
db.ref('rooms').orderByChild('status').equalTo('waiting').on('value',s=>{
 const el=$('rooms'),r=[];s.forEach(c=>{const v=c.val(),n=Object.keys(v.players||{}).length;if(n<8)r.push([c.key,v,n])});
 el.innerHTML=r.length?r.sort((a,b)=>b[1].createdAt-a[1].createdAt).slice(0,12).map(x=>`<div class="rm" onclick="join('${x[0]}')"><b>${x[0]}</b><span style="flex:1;font-size:12px">${MN[x[1].map]||''} · ${x[2]}/8</span>›</div>`).join(''):'<span style="font-size:12px;opacity:.6">Немає кімнат — створи свою</span>'});
$('bNew').onclick=async()=>{const c=genCode(),m=$('map').value;
 await db.ref('rooms/'+c).set({status:'waiting',hostId:MY_ID,map:m,createdAt:Date.now(),players:{[MY_ID]:newP(0)}});enter(c)};
$('bJoin').onclick=()=>join($('code').value.trim().toUpperCase());
async function join(c){const s=await db.ref('rooms/'+c).get();if(!s.exists())return toast('Кімнату не знайдено');const v=s.val();
 if(!(v.players||{})[MY_ID]){if(v.status!='waiting')return toast('Гра вже почалась');const n=Object.keys(v.players).length;if(n>=8)return toast('Кімната заповнена');
  await db.ref('rooms/'+c+'/players/'+MY_ID).set(newP(n));db.ref('logs/'+c).push({t:MY_NAME+' приєднався(лась)'})}enter(c)}
function enter(c){room=c;localStorage.mono_room=c;roomRef=db.ref('rooms/'+c);logRef=db.ref('logs/'+c);
 roomRef.on('value',s=>{if(!s.exists()){if(room){localStorage.removeItem('mono_room');toast('Кімнату закрито');setTimeout(()=>location.reload(),900)}return}
  game=s.val();if(curMap!=game.map){curMap=game.map;mk(curMap);bf=null}render()});
 logRef.limitToLast(60).on('value',s=>{logs=[];s.forEach(c=>logs.push(c.val()));drawLog()})}
$('bLeave').onclick=async()=>{localStorage.removeItem('mono_room');if(game.hostId==MY_ID){await roomRef.remove();logRef.remove()}else await roomRef.child('players/'+MY_ID).remove();location.reload()};
$('bStart').onclick=()=>{const o=Object.keys(game.players);for(let i=o.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[o[i],o[j]]=[o[j],o[i]]}
 roomRef.update({status:'playing',phase:'roll',turnOrder:o,currentTurn:0,turnCount:1,doubles:0,turnAt:Date.now()});logRef.push({t:'Гру розпочато!'})};
function rWait(){show('wait');$('wc').textContent=room;const ps=Object.values(game.players).sort((a,b)=>a.order-b.order);$('wn').textContent=ps.length;
 $('wl').innerHTML=ps.map(p=>`<div class="rm"><div class="av" style="--c:${p.color}">${p.avatar?`<img src="${esc(p.avatar)}">`:esc(p.name[0]||'?')}</div>${esc(p.name)}</div>`).join('');
 $('bStart').classList.toggle('hid',!(game.hostId==MY_ID&&ps.length>=2))}

/* ---- ЛОГІКА ГРИ (усе рахує гравець, чий хід; запис — атомарно) ---- */
async function run(f){if(lock)return;lock=1;try{await f()}catch(e){console.error(e);toast('Помилка')}finally{lock=0}}
async function commit(g,L,ids){const u={};if(ids){ids.forEach(k=>u['players/'+k]=g.players[k])}else{for(const k in g.players)u['players/'+k]=g.players[k];
 ['currentTurn','phase','doubles','dbl','turnCount','turnAt','lastDice','rollId','status','winner'].forEach(k=>{if(g[k]!==undefined)u[k]=g[k]})}
 await roomRef.update(u);for(const t of L)await logRef.push({t,ts:Date.now()})}
function nextTurn(g){const o=g.turnOrder;let n=g.currentTurn;for(let k=0;k<o.length;k++){n=(n+1)%o.length;if(!g.players[o[n]].bankrupt)break}
 g.currentTurn=n;g.phase='roll';g.doubles=0;g.dbl=false;g.turnCount=(g.turnCount||1)+1;g.turnAt=Date.now()}
function jail(g,p){p.pos=10;p.inJail=true;p.jailTurns=0;g.dbl=false}
function rent(g,c,o){const p=g.players[o];if(A(p.mortgaged).includes(c.i))return 0;
 if(c.t=='p'){const h=H(p,c.i);if(h)return c.r*[1,5,15,45,80,110][h];return B.filter(x=>x.g===c.g).every(x=>p.props.includes(x.i))?c.r*2:c.r}
 const n=B.filter(x=>x.t==c.t&&p.props.includes(x.i)).length;
 return c.t=='r'?[0,25,50,100,200][n]:(g.lastDice||[1,1]).reduce((a,b)=>a+b)*(n>1?10:4)}
function raise(g,p,L){for(const i of p.props.slice()){if(p.balance>=0)break;const c=B[i];
 if(c.t=='p'&&H(p,i)){p.balance+=H(p,i)*HC[c.g]/2;delete p.houses['h'+i]}
 if(!p.mortgaged.includes(i)){p.mortgaged.push(i);p.balance+=c.p/2;L.push(`🏦 ${p.name}: авто-застава «${c.n}»`)}}}
function bust(g,id,to,L){const p=g.players[id];if(to){const t=g.players[to];t.props=t.props.concat(p.props);t.mortgaged=t.mortgaged.concat(p.mortgaged)}
 p.props=[];p.houses={};p.mortgaged=[];p.bankrupt=true;p.balance=0;L.push(`💀 ${p.name} збанкрутував(ла)`);
 const al=Object.keys(g.players).filter(k=>!g.players[k].bankrupt);if(al.length==1){g.status='finished';g.phase='over';g.winner=al[0]}}
function pay(g,id,to,amt,L){const p=g.players[id];p.balance-=amt;if(p.balance<0)raise(g,p,L);
 if(p.balance<0){if(to)g.players[to].balance+=amt+p.balance;bust(g,id,to,L)}else if(to)g.players[to].balance+=amt}
function land(g,id,L,dbl){const p=g.players[id],c=B[p.pos];L.push(`${p.name} → «${c.n}»`);g.phase=dbl?'roll':'end';
 if(c.t=='J'){jail(g,p);g.phase='end';return}
 if(c.t=='t'){pay(g,id,null,c.a,L);return}
 if(c.t=='h'||c.t=='c'){const d=c.t=='h'?CH:CC,k=d[Math.random()*d.length|0];L.push('🃏 '+k[0]);
  if(k[1]=='m'){k[2]>0?p.balance+=k[2]:pay(g,id,null,-k[2],L)}
  else if(k[1]=='g'){p.pos=0;p.balance+=200}
  else if(k[1]=='j'){jail(g,p);g.phase='end'}
  else if(k[1]=='f')p.jailFree=true;
  else if(k[1]=='v'){if(k[2]<p.pos)p.balance+=200;p.pos=k[2];land(g,id,L,dbl)}
  else if(k[1]=='a'){for(const o in g.players)if(o!=id&&!g.players[o].bankrupt)pay(g,o,id,k[2],L)}
  return}
 if('pru'.includes(c.t)){const o=owner(g,c.i);if(!o)g.phase='buy';else if(o!=id){const r=rent(g,c,o);if(r){L.push(`💰 рента ${r}₴ → ${g.players[o].name}`);pay(g,id,o,r,L)}}}}
function finish(g,id,L){if(g.status!='finished'&&g.players[id].bankrupt)nextTurn(g);else if(g.phase=='roll')g.turnAt=Date.now();return commit(g,L)}
const roll=()=>run(async()=>{if(!game||game.phase!='roll')return;
 const g=snap(),id=g.turnOrder[g.currentTurn],p=g.players[id],d=[1+Math.random()*6|0,1+Math.random()*6|0],L=[`🎲 ${p.name}: ${d[0]}+${d[1]}`];
 let dbl=d[0]==d[1],mv=true;g.lastDice=d;g.rollId=Date.now();g.doubles=(g.doubles||0)+(dbl?1:0);
 if(p.inJail){g.doubles=0;
  if(dbl){p.inJail=false;dbl=false;L.push("🔓 дублі — вихід з в'язниці")}
  else if(p.jailFree){p.jailFree=false;p.inJail=false;L.push('🔓 використано карту')}
  else if(++p.jailTurns>=3){p.inJail=false;L.push('🔓 платить 50₴');pay(g,id,null,50,L)}
  else{mv=false;g.phase='end';g.dbl=false}}
 else if(g.doubles>=3){jail(g,p);L.push("3 дублі — у в'язницю!");mv=false;g.phase='end'}
 if(mv&&!p.bankrupt){const np=p.pos+d[0]+d[1];if(np>=40){p.balance+=200;L.push('+200₴ за СТАРТ')}p.pos=np%40;g.dbl=dbl;land(g,id,L,dbl)}
 await finish(g,id,L)});
const afterBuy=g=>{g.phase=g.dbl?'roll':'end';if(g.phase=='roll')g.turnAt=Date.now()};
const buy=()=>run(async()=>{if(game.phase!='buy')return;const g=snap(),id=g.turnOrder[g.currentTurn],p=g.players[id],c=B[p.pos];
 if(p.balance<c.p)return toast('Недостатньо грошей');p.balance-=c.p;p.props.push(c.i);afterBuy(g);await commit(g,[`🏠 ${p.name} купує «${c.n}» за ${c.p}₴`])});
const decline=()=>run(async()=>{if(game.phase!='buy')return;const g=snap(),p=g.players[g.turnOrder[g.currentTurn]];afterBuy(g);await commit(g,[`${p.name} не купує «${B[p.pos].n}»`])});
const endTurn=()=>run(async()=>{if(game.phase!='end')return;const g=snap();nextTurn(g);await commit(g,[])});
const auto=()=>{const ph=game.phase;ph=='roll'?roll():ph=='buy'?decline():ph=='end'?endTurn():0};
function act(k,i){run(async()=>{const g=snap(),p=g.players[MY_ID],c=B[i],L=[],gr=B.filter(x=>c.t=='p'&&x.g===c.g),h=H(p,i),cost=HC[c.g];
 if(k=='b'){if(!gr.every(x=>p.props.includes(x.i)&&!p.mortgaged.includes(x.i)))return toast('Потрібна монополія без застави');
  if(h>=5)return toast('Максимум');if(gr.some(x=>H(p,x.i)<h))return toast('Будуйте рівномірно');if(p.balance<cost)return toast('Мало грошей');
  p.balance-=cost;p.houses['h'+i]=h+1;L.push(`🏗 ${p.name} будує на «${c.n}»`)}
 else if(k=='s'){if(!h)return;if(gr.some(x=>H(p,x.i)>h))return toast('Продавайте рівномірно');p.balance+=cost/2;p.houses['h'+i]=h-1;L.push(`${p.name} продає будинок на «${c.n}»`)}
 else if(p.mortgaged.includes(i)){const v=c.p*.55|0;if(p.balance<v)return toast('Мало грошей');p.balance-=v;p.mortgaged=p.mortgaged.filter(x=>x!=i);L.push(`🏦 ${p.name} викупив «${c.n}»`)}
 else{if(gr.some(x=>H(p,x.i)))return toast('Спершу продайте будинки групи');p.mortgaged.push(i);p.balance+=c.p/2;L.push(`🏦 ${p.name} заклав «${c.n}»`)}
 await commit(g,L,[MY_ID])})}
$('bRoll').onclick=roll;$('bEnd').onclick=endTurn;
$('bSur').onclick=()=>{if(!confirm('Здатися і вийти?'))return;run(async()=>{const g=snap(),L=[];bust(g,MY_ID,null,L);
 if(g.status!='finished'&&g.turnOrder[g.currentTurn]==MY_ID)nextTurn(g);await commit(g,L);localStorage.removeItem('mono_room');location.reload()})};

const FACE={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};

function drawLog(){const f=$('feed');if(!f||!game)return;const ps=Object.values(game.players||{}).filter(p=>p.name).sort((a,b)=>b.name.length-a.name.length);
 const low=f.scrollTop+f.clientHeight>=f.scrollHeight-20;
 f.innerHTML=logs.map(m=>{const tt=m.ts?`<span class="tt">${new Date(m.ts).toTimeString().slice(0,5)}</span>`:'';
  if(m.chat)return`<div class="fm ch" style="--c:${esc(m.c)}">${tt}<b>${esc(m.n)}</b>${esc(m.t)}</div>`;
  const q=m.t.replace(/^[^\p{L}\p{N}]+/u,''),p=ps.find(x=>q.startsWith(x.name));
  return p?`<div class="fm" style="--c:${p.color}">${tt}<b>${esc(p.name)}</b>${esc(q.slice(p.name.length).replace(/^[:\s]+/,''))}</div>`:`<div class="fm">${tt}${esc(m.t)}</div>`}).join('');
 if(low)f.scrollTop=f.scrollHeight}

 d.onclick=e=>{if(e.target===d&&id!='buyM')d.remove()};document.body.appendChild(d)}

 return'<h3>🏠 Власність</h3>'+p.props.map(i=>{const c=B[i],m=p.mortgaged.includes(i),h=c.t=='p'?H(p,i):0;
 return`<div class="ar"><i style="background:${c.t=='p'?GCOL[c.g]:'#888'}"></i><div class="in"><b>${esc(c.n)}</b>${m?'🏦 застава':h==5?'🏨':'🏠'.repeat(h)||'—'}</div>`+
 (c.t=='p'?`<button onclick="act('b',${i})">+🏠 ${HC[c.g]}</button>${h?`<button onclick="act('s',${i})">−🏠</button>`:''}`:'')+
 `<button onclick="act('m',${i})">${m?'Викуп '+(c.p*.55|0):'Закл. +'+c.p/2}</button></div>`}).join('')}
$('bProps').onclick=()=>{if(game.players[MY_ID])modal(propsHTML(),'pm')};

 const g=game,ids=g.turnOrder,cid=ids[g.currentTurn],cur=g.players[cid],mine=cid==MY_ID,ph=g.phase;
 B.forEach(c=>{if(!'pru'.includes(c.t))return;const el=$('c'+c.i),o=owner(g,c.i),op=o&&g.players[o];
  el.style.boxShadow=op?`inset 0 0 0 3px ${op.color}`:'';el.style.opacity=op&&A(op.mortgaged).includes(c.i)?.45:1;
  if(c.t=='p'){const h=op?H(op,c.i):0;el.querySelector('.hr').innerHTML=h==5?'🏨':'<i></i>'.repeat(h)}});
 Object.entries(g.players).sort((a,b)=>a[1].order-b[1].order).forEach(([id,p],k)=>{let t=$('t'+id);
  if(!t){t=document.createElement('div');t.id='t'+id;t.className='tok';$('tk').appendChild(t)}
  const [r,c]=cp(p.pos),u=100/11,s=u*.44;t.style.display=p.bankrupt?'none':'flex';t.style.background=p.color;
  t.innerHTML=p.avatar?`<img src="${esc(p.avatar)}">`:esc(p.name[0]||'?');
  t.style.left=((c-1)*u+u*.06+(k%4)*(s+u*.03))+'%';t.style.top=((r-1)*u+u-s*((k/4|0)+1)-u*.06)+'%'});
 $('pl').innerHTML=ids.map(id=>{const p=g.players[id];if(!p)return'';const on=id==cid&&!p.bankrupt&&ph!='over';
  return`<div class="pc${on?' on':''}${p.bankrupt?' x':''}" style="--c:${p.color}">${on?'<span class="tm">60 c</span>':''}<div class="av">${p.avatar?`<img src="${esc(p.avatar)}">`:esc(p.name[0]||'?')}</div><div><div class="nm">${esc(p.name)}</div>${p.bankrupt?'<div style="font-size:8px;opacity:.7">БАНКРУТ</div>':`<div class="bal">${p.balance.toLocaleString()} ₴</div>`}</div></div>`}).join('');
 let t,s='';if(ph=='over')t='Гру завершено';else if(mine){t='Ваш хід';s={roll:'Киньте кубики.',end:'Завершіть хід.',buy:'Купувати власність?'}[ph]||''}
 else{t='Хід гравця '+cur.name;s=ph=='buy'?'Очікуємо рішення про купівлю.':'Очікуйте завершення ходу.'}

 $('st').style.borderLeftColor=cur.color;$('st').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px">${cc.t!='p'?ICO[cc.t]+' ':''}${esc(cc.n)}</b>${cc.t=='p'?`<span>${oh}/5 🏠</span>`:''}</div><span>${esc(t)}${s?' — '+s:''}${co?' · власник: '+esc(g.players[co].name):''}</span>${cc.t=='p'?`<div style="height:8px;border-radius:6px;background:#0b1026;margin-top:6px"><div style="height:100%;width:${oh*20}%;border-radius:6px;background:#2ecc71"></div></div>`:''}`;
