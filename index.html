<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Монополія Україна</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
/* =========================================================
   BASE
========================================================= */

:root{
  --bg:#050b18;
  --bg2:#08142b;
  --panel:#0b1832;
  --panel2:#101f3d;
  --line:#263d69;

  --white:#f5f8ff;
  --muted:#8d9bb8;

  --gold:#ffd23f;
  --gold2:#e7a900;
  --blue:#2674e8;
  --blue2:#49b7ff;
  --green:#2ee67a;
  --red:#ff4e62;

  --shadow:0 12px 35px rgba(0,0,0,.45);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;

  min-height:100%;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(41,111,220,.38),
      transparent 45%
    ),
    radial-gradient(
      circle at 10% 55%,
      rgba(255,210,63,.08),
      transparent 35%
    ),
    #050b18;

  color:var(--white);

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  padding-top:env(safe-area-inset-top,0);
  padding-bottom:env(safe-area-inset-bottom,0);
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

img{
  max-width:100%;
}


/* =========================================================
   LOBBY
========================================================= */

#lobby{
  position:relative;

  width:100%;
  max-width:480px;

  min-height:100vh;

  margin:0 auto;

  padding:
    0
    14px
    calc(30px + env(safe-area-inset-bottom,0))
    14px;

  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      rgba(5,13,31,.25),
      rgba(5,11,24,.94) 55%,
      #050b18 100%
    );
}


/* =========================================================
   DECORATIVE SKY / CITY
========================================================= */

#lobby::before{
  content:"";

  position:absolute;

  left:-20%;
  right:-20%;
  top:0;

  height:410px;

  z-index:0;

  background:
    radial-gradient(
      ellipse at 50% 10%,
      rgba(77,170,255,.38),
      transparent 55%
    ),
    linear-gradient(
      180deg,
      #123e72 0%,
      #0c2b54 40%,
      #07162d 100%
    );

  border-radius:0 0 50% 50%;

  pointer-events:none;
}


/* декоративні хмари */

#lobby::after{
  content:"";

  position:absolute;

  top:110px;
  left:0;
  right:0;

  height:230px;

  opacity:.18;

  background:
    radial-gradient(
      ellipse at 20% 40%,
      #fff 0 8%,
      transparent 9%
    ),
    radial-gradient(
      ellipse at 35% 30%,
      #fff 0 10%,
      transparent 11%
    ),
    radial-gradient(
      ellipse at 70% 40%,
      #fff 0 9%,
      transparent 10%
    ),
    radial-gradient(
      ellipse at 82% 28%,
      #fff 0 7%,
      transparent 8%
    );

  filter:blur(7px);

  pointer-events:none;
}


/* =========================================================
   CONTENT LAYER
========================================================= */

#lobby > *{
  position:relative;
  z-index:2;
}


/* =========================================================
   HERO
========================================================= */

.lobby-hero{
  position:relative;

  padding:
    24px
    0
    18px;

  text-align:center;
}


/* маленький декоративний бейдж */

.lobby-hero::before{
  content:"🇺🇦  TELEGRAM MINI GAME";

  display:inline-flex;

  align-items:center;
  justify-content:center;

  padding:6px 12px;

  margin-bottom:13px;

  border-radius:999px;

  border:1px solid rgba(255,255,255,.15);

  background:rgba(4,12,29,.55);

  color:#cbd9f5;

  font-size:9px;

  font-weight:800;

  letter-spacing:1.5px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.25);
}


/* Логотип */

.lobby-logo{
  position:relative;

  width:84px;
  height:84px;

  margin:0 auto 14px;

  display:grid;
  place-items:center;

  font-size:40px;

  border-radius:23px;

  background:
    linear-gradient(
      145deg,
      #fff3a8 0%,
      #ffd23f 35%,
      #e49f00 100%
    );

  border:3px solid #fff2a0;

  box-shadow:
    0 8px 0 #9d6900,
    0 14px 38px rgba(255,190,0,.45);

  transform:rotate(-2deg);
}

.lobby-logo::before{
  content:"";

  position:absolute;

  inset:5px;

  border-radius:17px;

  border:1px solid rgba(255,255,255,.65);
}

.lobby-logo::after{
  content:"";

  position:absolute;

  width:18px;
  height:18px;

  right:-6px;
  top:-7px;

  border-radius:50%;

  background:#2ee67a;

  border:3px solid #07152c;

  box-shadow:0 0 15px #2ee67a;
}


/* Назва */

#lobby h1{
  margin:0;

  font-size:34px;

  line-height:1;

  font-weight:950;

  letter-spacing:-1.5px;

  text-transform:uppercase;

  color:#fff;

  text-shadow:
    0 3px 0 #174f94,
    0 7px 20px rgba(0,0,0,.6);
}

#lobby h1::after{
  content:"";

  display:block;

  width:130px;
  height:6px;

  margin:9px auto 0;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      #2674e8 0 50%,
      #ffd23f 50% 100%
    );

  box-shadow:0 3px 12px rgba(255,210,63,.25);
}

.lobby-sub{
  margin-top:9px;

  color:#a9b8d5;

  font-size:12px;

  font-weight:600;

  letter-spacing:.4px;
}


/* =========================================================
   PLAYER CARD
========================================================= */

.hd{
  position:relative;

  display:flex;
  align-items:center;

  gap:11px;

  margin:3px 0 10px;

  padding:10px 12px;

  border-radius:17px;

  background:
    linear-gradient(
      135deg,
      rgba(18,36,70,.94),
      rgba(7,17,37,.94)
    );

  border:1px solid rgba(92,133,205,.35);

  box-shadow:
    0 10px 25px rgba(0,0,0,.3),
    inset 0 1px 0 rgba(255,255,255,.04);

  text-align:left;
}

.hd::before{
  content:"";

  position:absolute;

  left:0;
  top:12px;
  bottom:12px;

  width:3px;

  border-radius:5px;

  background:
    linear-gradient(
      180deg,
      #ffd23f,
      #2674e8
    );

  box-shadow:0 0 10px rgba(255,210,63,.4);
}

.hd .av{
  --c:#ffd23f;
}

.big{
  width:50px;
  height:50px;

  flex:none;

  font-size:20px;
}

#meName{
  font-size:15px;
  font-weight:850;
}

#meUser{
  font-size:11px;
}


/* =========================================================
   AVATAR
========================================================= */

.av{
  position:relative;

  display:grid;
  place-items:center;

  width:32px;
  height:32px;

  border-radius:50%;

  border:2px solid var(--c,#4aa8ff);

  background:
    linear-gradient(
      135deg,
      #263b68,
      #101c38
    );

  overflow:hidden;

  box-shadow:
    0 0 8px rgba(74,168,255,.25);
}

.av img{
  width:100%;
  height:100%;

  object-fit:cover;

  border-radius:50%;
}

.av::after{
  content:'';

  position:absolute;

  inset:-3px;

  background:
    var(--fi,none)
    center/100% 100%
    no-repeat;

  pointer-events:none;

  border-radius:50%;
}

.av[data-b]::before{
  content:attr(data-b);

  position:absolute;

  top:-7px;
  right:-7px;

  font-size:12px;

  z-index:3;

  line-height:1;
}


/* =========================================================
   SOURCE / CONNECTION
========================================================= */

#src{
  display:none;
}

#connectionStatus{
  min-height:0;

  margin:2px 0 10px;

  font-size:11px;

  font-weight:600;

  color:#7f8fb3;

  transition:.2s;
}

#connectionStatus.cs.ok{
  color:#2ee67a;
}

#connectionStatus.cs.err{
  color:#ff6575;
}


/* =========================================================
   MAP SELECT
========================================================= */

.rowm{
  display:flex;
  align-items:center;

  gap:9px;

  margin:8px 0 10px;

  padding:10px 12px;

  border-radius:13px;

  background:rgba(10,21,48,.8);

  border:1px solid #1c2c52;

  text-align:left;

  font-size:12px;

  font-weight:700;
}

.rowm span{
  flex:none;
}

.rowm select{
  flex:1;

  min-width:0;

  background:#08152e;

  color:#e8eefc;

  border:1px solid #263d69;

  border-radius:9px;

  padding:8px;

  outline:none;
}


/* =========================================================
   MAIN CREATE BUTTON
========================================================= */

#lobby .gb{
  position:relative;

  display:block;

  width:100%;

  margin:8px 0;

  padding:16px 18px;

  border:1px solid #ffe47d;

  border-radius:17px;

  background:
    linear-gradient(
      135deg,
      #ffe16a 0%,
      #ffd23f 45%,
      #e5a500 100%
    );

  color:#251900;

  font-size:16px;

  font-weight:950;

  box-shadow:
    0 6px 0 #9c6800,
    0 12px 28px rgba(255,196,25,.28);

  overflow:hidden;
}

#lobby .gb::before{
  content:"";

  position:absolute;

  top:0;
  left:-100%;

  width:60%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.45),
      transparent
    );

  transform:skewX(-20deg);

  animation:lobbyShine 4s infinite;
}

@keyframes lobbyShine{
  0%,55%{
    left:-100%;
  }

  75%,100%{
    left:140%;
  }
}

#lobby .gb:active{
  transform:translateY(3px);
  box-shadow:
    0 3px 0 #9c6800,
    0 8px 20px rgba(255,196,25,.25);
}


/* =========================================================
   BOT ROW
========================================================= */

.rowb{
  display:flex;

  gap:7px;

  margin:9px 0;
}

#lobby .rowb button{
  flex:1;

  width:auto;
  margin:0;

  padding:13px 8px;

  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      #162f64,
      #0d1d3c
    );

  border:1px solid #315da7;

  color:#dbe8ff;

  font-size:13px;
}

.rowb select{
  width:60px;

  background:#0a1530;

  color:#fff;

  border:1px solid #315da7;

  border-radius:13px;

  font-size:15px;

  text-align:center;
}


/* =========================================================
   JOIN ROOM
========================================================= */

.row2{
  display:flex;

  gap:7px;

  margin:9px 0;
}

#lobby .row2 input{
  flex:1;

  min-width:0;

  margin:0;

  padding:13px;

  background:
    linear-gradient(
      135deg,
      #0d1c38,
      #09152c
    );

  border:1px solid #263d69;

  border-radius:13px;

  color:#fff;

  font-size:13px;

  outline:none;
}

#lobby .row2 input::placeholder{
  color:#667a9f;
}

#lobby .row2 input:focus{
  border-color:#4aa8ff;

  box-shadow:
    0 0 0 3px rgba(74,168,255,.1);
}

#lobby .row2 button{
  width:auto;

  margin:0;

  padding:0 18px;

  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      #2ee67a,
      #18b95e
    );

  color:#042714;

  box-shadow:
    0 4px 15px rgba(46,230,122,.2);
}


/* =========================================================
   AVAILABLE ROOMS
========================================================= */

.sec{
  display:flex;

  align-items:end;
  justify-content:space-between;

  margin:20px 2px 10px;

  text-align:left;
}

.sec h3{
  margin:0;

  font-size:16px;

  font-weight:850;
}

.sec small{
  font-size:10px;
}


/* room */

.rm{
  position:relative;

  display:flex;
  align-items:center;

  gap:10px;

  width:100%;

  margin-bottom:8px;

  padding:11px;

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      rgba(16,32,63,.96),
      rgba(8,19,40,.96)
    );

  border:1px solid #22385f;

  border-left:4px solid #ffd23f;

  box-shadow:
    0 7px 18px rgba(0,0,0,.22);

  text-align:left;

  overflow:hidden;
}

.rm::after{
  content:"";

  position:absolute;

  right:-30px;
  top:-40px;

  width:100px;
  height:100px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,210,63,.12),
      transparent 65%
    );

  pointer-events:none;
}

.rm .av{
  flex:none;

  width:45px;
  height:45px;

  font-size:18px;
}

.ri{
  flex:1;

  min-width:0;
}

.ri b{
  display:block;

  margin-bottom:2px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  font-size:13px;
}

.ri small{
  color:#7f8fb3;

  font-size:10px;
}

#lobby .rm button{
  width:auto;

  margin:0;

  padding:9px 12px;

  border-radius:10px;

  background:
    linear-gradient(
      135deg,
      #2f6fe0,
      #2055b3
    );

  border:1px solid #4b83eb;

  color:#fff;

  font-size:11px;
}

.bd{
  display:inline-block;

  padding:2px 7px;

  margin-top:3px;

  border-radius:7px;

  font-size:9px;

  font-weight:800;
}

.pg{
  background:#16306a;
  color:#7fb2ff;
}

.wt{
  background:#14391f;
  color:#5de08a;
}


/* =========================================================
   WAITING ROOM
========================================================= */

#waitingRoom{
  padding-top:12px;
}

#waitingRoom > .code{
  margin:15px 0;

  padding:15px;

  border-radius:17px;

  background:
    linear-gradient(
      135deg,
      #14294f,
      #0b1832
    );

  border:1px solid #29456f;

  box-shadow:
    0 8px 25px rgba(0,0,0,.3);
}

.code{
  font-size:12px;

  color:#93a4c4;
}

.code b{
  display:block;

  margin-top:4px;

  font-size:27px;

  color:#ffd23f;

  letter-spacing:3px;

  text-shadow:
    0 0 15px rgba(255,210,63,.35);
}


/* players */

.pi{
  display:flex;
  align-items:center;

  gap:9px;

  margin-bottom:6px;

  padding:10px;

  border-radius:13px;

  background:#0e1a36;

  border:1px solid #1c2c52;
}

.pi .av{
  width:32px;
  height:32px;

  font-size:14px;
}


/* waiting buttons */

#waitingRoom button{
  width:100%;

  margin:5px 0;

  padding:12px;

  border-radius:13px;

  font-size:13px;
}

#startGameBtn{
  background:
    linear-gradient(
      135deg,
      #ffd23f,
      #e7a900
    );

  color:#251900;

  box-shadow:
    0 5px 18px rgba(255,210,63,.25);
}

#startGameBtn:disabled{
  opacity:.35;

  box-shadow:none;
}


/* =========================================================
   STATS / OTHER EXISTING COMPONENTS
========================================================= */

.stats-row{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:8px;

  margin:12px 0;
}

.stat-card{
  background:#0a1530;

  border:1px solid #1c2c52;

  border-radius:12px;

  padding:10px 6px;

  text-align:center;
}

.stat-card .si{
  font-size:20px;
}

.stat-card .sv{
  font-size:16px;

  font-weight:800;

  color:#ffd23f;

  margin:4px 0;
}

.stat-card .sl{
  font-size:10px;

  color:#7f8fb3;

  letter-spacing:.5px;
}


/* =========================================================
   OVERLAY / MODALS
========================================================= */

.ov{
  position:fixed;

  inset:0;

  background:
    rgba(2,6,18,.82);

  display:grid;

  place-items:center;

  z-index:50;

  padding:16px;

  backdrop-filter:blur(7px);
}

.md{
  width:100%;
  max-width:440px;

  background:
    linear-gradient(
      145deg,
      #142450,
      #0b1530
    );

  border:1px solid #2b3f7a;

  border-radius:24px;

  padding:16px;

  box-shadow:
    0 25px 70px rgba(0,0,0,.65);
}

.mh{
  display:flex;

  gap:12px;

  align-items:center;
}

.mh .x{
  margin-left:auto;

  border-radius:50%;

  width:36px;
  height:36px;

  padding:0;

  background:#0a1530;

  border:1px solid #1c2c52;
}

.gd{
  color:#e6b800;

  font-weight:700;

  letter-spacing:1px;

  font-size:11px;
}

.md h2{
  margin:2px 0;

  font-size:22px;
}

.mm{
  color:#2ee67a;

  font-weight:800;

  font-size:18px;
}


/* =========================================================
   GENERIC BUTTONS
========================================================= */

button{
  border:0;

  border-radius:10px;

  background:#2f6fe0;

  color:#fff;

  padding:8px 11px;

  font-size:12px;

  font-weight:700;
}

button.y{
  background:#2ee67a;
  color:#042714;
}

button.n{
  background:#3a4770;
}

.mut{
  color:#7f8fb3;
}


/* =========================================================
   GAME AREA — ЗАЛИШАЄМО СУМІСНИМ З ГРОЮ
========================================================= */

#gameBoard{
  width:100%;
}

#app{
  max-width:480px;

  margin:0 auto;

  padding:6px 6px 12px;
}

#top{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:6px;

  margin-bottom:8px;
}

.pl{
  position:relative;

  display:flex;
  align-items:center;

  gap:6px;

  padding:6px;

  border:2px solid var(--c);

  border-radius:10px;

  background:#0e1a36;

  min-width:0;
}

.pl.on{
  box-shadow:
    0 0 12px var(--c),
    inset 0 0 8px var(--c);
}

.pl.dead{
  opacity:.45;

  border-color:#1c2c52;
}

.pl div{
  min-width:0;

  font-size:11px;

  line-height:1.25;
}

.pl b{
  display:block;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.pl span{
  color:#2ee67a;

  font-weight:700;

  font-size:12px;
}

.pl.dead span{
  color:#c66;

  font-size:9px;
}

.tm{
  position:absolute;

  top:-6px;
  right:4px;

  background:#12382a;

  color:#2ee67a;

  border:1px solid #2ee67a;

  border-radius:8px;

  font-size:9px;

  padding:0 5px;
}


/* avatar game */

.pl .av{
  flex:none;

  width:30px;
  height:30px;
}


/* board */

#bd{
  position:relative;

  display:grid;

  grid-template:
    1.3fr repeat(9,1fr) 1.3fr /
    1.5fr repeat(9,1fr) 1.5fr;

  gap:2px;

  padding:16px;

  border:1px dashed #1c2c52;

  border-radius:12px;

  aspect-ratio:1/1.36;

  background:
    var(--bdimg,none)
    center/cover no-repeat,
    #0a1530 !important;
}

.t{
  position:relative;

  min-width:0;
  min-height:0;

  cursor:pointer;
}

.in{
  position:absolute;

  inset:0;

  background:var(--b,#fff);

  border-radius:5px;

  color:#111;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:2px;

  overflow:hidden;

  padding:1px;

  text-align:center;
}

.top .in,
.bot .in{
  flex-direction:column;
}

.lf .in,
.rt .in{
  flex-direction:row;
}

.em{
  font-size:clamp(12px,4.2vw,20px);

  line-height:1;
}

.nm{
  font-size:clamp(5px,1.7vw,8px);

  font-weight:800;

  line-height:1;

  word-break:break-word;
}

.top .nm,
.bot .nm{
  writing-mode:vertical-rl;
}

.pr{
  position:absolute;

  background:var(--g);

  color:#fff;

  font-size:clamp(6px,2vw,9px);

  font-weight:800;

  padding:1px 4px;

  border-radius:3px;

  white-space:nowrap;
}

.top .pr{
  top:-13px;
  left:50%;

  transform:translateX(-50%);
}

.bot .pr{
  bottom:-13px;
  left:50%;

  transform:translateX(-50%);
}

.lf .pr{
  left:-15px;
  top:50%;

  transform:
    translateY(-50%)
    rotate(-90deg);
}

.rt .pr{
  right:-15px;
  top:50%;

  transform:
    translateY(-50%)
    rotate(90deg);
}

.st{
  position:absolute;

  bottom:0;
  left:0;
  right:0;

  text-align:center;

  font-size:8px;

  color:#f5a800;

  line-height:1;

  text-shadow:0 0 2px #000;
}

.tk{
  position:absolute;

  top:0;
  right:0;

  display:flex;

  flex-wrap:wrap;

  gap:1px;

  z-index:2;
}

.tk s{
  width:clamp(14px,4vw,18px);

  height:clamp(14px,4vw,18px);

  border-radius:50%;

  border:2px solid var(--c);

  background:#16264a;

  font-size:9px;

  display:grid;

  place-items:center;

  text-decoration:none;

  z-index:5;

  box-shadow:
    0 1px 4px rgba(0,0,0,.5);
}

.tk s.tkn{
  animation:none;
}

.tk s.hop{
  animation:stepHop .16s ease-out;
}

@keyframes stepHop{
  0%{
    transform:translateY(-7px) scale(1.25);
  }

  100%{
    transform:translateY(0) scale(1);
  }
}

.sp .in{
  background:var(--tile,#fff);
}

.sp .em{
  font-size:clamp(16px,6vw,28px);
}


/* =========================================================
   CENTER GAME PANEL
========================================================= */

#mid{
  grid-area:2/2/11/11;

  background:#0e1a36;

  border:1px solid #1c2c52;

  border-radius:10px;

  padding:6px;

  display:flex;

  flex-direction:column;

  gap:5px;

  min-height:0;

  margin:4px;
}

#mid h3{
  margin:0;

  font-size:14px;

  display:flex;

  justify-content:space-between;

  align-items:center;
}

.hb{
  display:flex;

  gap:4px;

  align-items:center;
}

.ib{
  border:1px solid #1c2c52;

  background:#0a1530;

  color:#e8eefc;

  border-radius:8px;

  padding:2px 7px;

  font-size:11px;
}

#log{
  flex:1;

  overflow:auto;

  display:flex;

  flex-direction:column;

  gap:5px;

  min-height:0;

  border-top:1px solid #1c2c52;

  padding-top:4px;
}

.ev{
  font-size:12.5px;

  line-height:1.3;

  padding:0 4px;
}

.ev b{
  color:var(--c);
}

.ev.c{
  border-left:3px solid var(--c);

  background:#0a1530;

  border-radius:6px;

  padding:3px 8px;
}

.ev.c b{
  display:block;

  font-size:11px;
}


/* =========================================================
   GAME CONTROLS
========================================================= */

#acts{
  min-height:64px;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:8px 0;
}

#acts .fab{
  position:static;

  transform:none;

  padding:12px 28px;

  font-size:17px;

  white-space:nowrap;

  animation:fp2 1.4s infinite;
}

@keyframes fp2{
  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.05);
  }
}

#acts .buybar{
  position:static;

  transform:none;

  width:100%;

  max-width:480px;
}

.buybar{
  display:flex;

  gap:8px;

  width:min(360px,92%);
}

.buybar button{
  flex:1;

  padding:14px 12px;

  font-size:15px;

  border-radius:14px;
}

.tl{
  display:none;

  margin-top:6px;

  padding:6px 10px;

  border-radius:8px;

  background:#16306a;

  color:#cfe0ff;

  font-size:13px;

  font-weight:600;
}

.tl.on{
  display:block;
}


/* =========================================================
   DICE
========================================================= */

#dz{
  position:fixed;

  inset:0;

  display:none;

  place-items:center;

  z-index:40;

  pointer-events:none;

  background:rgba(2,6,18,.45);
}

.dw{
  display:flex;

  gap:24px;
}

.dd{
  will-change:transform;
}

.die{
  width:84px;
  height:84px;

  background:
    var(--dimg,none)
    center/cover no-repeat,
    var(--dbg,#fff);

  border-radius:18px;

  display:grid;

  grid-template:
    repeat(3,1fr) /
    repeat(3,1fr);

  padding:11px;

  gap:2px;

  box-shadow:
    0 10px 28px rgba(0,0,0,.55),
    inset 0 -4px 0 rgba(0,0,0,.12);
}

.die i{
  display:block;

  border-radius:50%;
}

.die i.p{
  background:var(--dpip,#111);

  box-shadow:var(--dglow,none);
}

.dd.roll{
  animation:tmb 1s cubic-bezier(.3,.7,.4,1);
}

.dd.d2.roll{
  animation-name:tmb2;

  animation-delay:.07s;
}

.dd.pop{
  animation:pop .35s ease-out;
}

@keyframes tmb{
  0%{
    transform:
      translate(-90px,-260px)
      rotate(0)
      scale(.5);

    opacity:0;
  }

  15%{
    opacity:1;
  }

  45%{
    transform:
      translate(10px,0)
      rotate(260deg)
      scale(1.15);
  }

  60%{
    transform:
      translate(0,-60px)
      rotate(400deg)
      scale(1.05);
  }

  78%{
    transform:
      translate(0,0)
      rotate(560deg)
      scale(1);
  }

  90%{
    transform:
      translate(0,-16px)
      rotate(680deg);
  }

  100%{
    transform:
      translate(0,0)
      rotate(720deg);
  }
}

@keyframes tmb2{
  0%{
    transform:
      translate(90px,-260px)
      rotate(0)
      scale(.5);

    opacity:0;
  }

  15%{
    opacity:1;
  }

  45%{
    transform:
      translate(-10px,0)
      rotate(-300deg)
      scale(1.15);
  }

  60%{
    transform:
      translate(0,-60px)
      rotate(-440deg)
      scale(1.05);
  }

  78%{
    transform:
      translate(0,0)
      rotate(-600deg)
      scale(1);
  }

  90%{
    transform:
      translate(0,-16px)
      rotate(-700deg);
  }

  100%{
    transform:
      translate(0,0)
      rotate(-720deg);
  }
}

@keyframes pop{
  0%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.18);
  }

  100%{
    transform:scale(1);
  }
}

.sum{
  position:absolute;

  top:calc(50% + 84px);

  font-size:28px;

  font-weight:800;

  color:#ffd23f;

  text-shadow:0 2px 10px #000;

  opacity:0;
}

.sum.on{
  opacity:1;
}


/* =========================================================
   MISC GAME COMPONENTS
========================================================= */

.row{
  display:flex;

  gap:4px;
}

.row input{
  flex:1;

  min-width:0;

  background:#0a1530;

  border:1px solid #1c2c52;

  border-radius:8px;

  color:#e8eefc;

  padding:6px 8px;

  font-size:12px;
}

#sc{

  border:1px solid #1c2c52;

  border-radius:10px;

  padding:7px 9px;
}

#sc b{
  font-size:15px;

  display:block;
}

#sc small{
  color:#7f8fb3;

  font-size:11px;
}

#sc .ac{
  display:flex;

  gap:5px;

  margin-top:6px;
}

#sc .ac button{
  flex:1;
}

.chips{
  display:flex;

  flex-wrap:wrap;

  gap:4px;

  max-height:34vh;

  overflow:auto;
}

.chip{
  font-size:11px;

  padding:4px 6px;

  border-radius:8px;

  background:#16264a;

  border:1px solid #1c2c52;
}

.chip.on{
  background:#1f7a5a;

  border-color:#2ee67a;
}

.chip.dis{
  opacity:.4;
}

.cash{
  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-top:8px;

  font-size:13px;
}

.cash button{
  padding:4px 12px;
}

.tbar{
  display:flex;

  gap:8px;

  align-items:center;

  justify-content:space-between;

  background:#2a2418;

  border:1px solid #7a6320;

  border-radius:10px;

  padding:6px 10px;

  margin:0 0 8px;

  font-size:12px;
}

.tbar button{
  padding:4px 10px;
}

.ticon{
  flex:none;

  width:56px;
  height:56px;

  border-radius:14px;

  background:#fff;

  display:grid;

  place-items:center;

  font-size:28px;

  overflow:hidden;

  padding:4px;
}

.ticon img{
  max-width:100%;
  max-height:100%;

  object-fit:contain;
}

.rtb{
  width:100%;

  border-collapse:collapse;

  margin-top:10px;
}

.rtb td{
  padding:7px 4px;

  border-bottom:1px solid #1c2c52;

  font-size:13px;
}

.rtb td:last-child{
  text-align:right;

  font-weight:700;

  white-space:nowrap;
}

.dotg{
  display:inline-block;

  width:10px;
  height:10px;

  border-radius:50%;

  margin-right:4px;
}

.thm{
  height:44px;

  border-radius:10px;

  border:1px solid #1c2c52;

  display:flex;

  gap:3px;

  align-items:flex-end;

  justify-content:center;

  padding:5px;

  margin:0 auto 6px;
}

.thm span{
  width:14px;
  height:14px;

  border-radius:3px;
}


/* =========================================================
   SKINS
========================================================= */

.skg{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:8px;

  margin:8px 0 14px;
}

.sk{
  text-align:center;

  border:1px solid #1c2c52;

  border-radius:12px;

  padding:10px 4px 6px;

  background:#0a1530;
}

.sk.on{
  border-color:#2ee67a;

  background:#0f2f2a;
}

.sk .die,
.sk .av{
  margin:0 auto 6px;
}

.die.mini{
  width:44px;
  height:44px;

  padding:6px;

  border-radius:10px;

  gap:1px;
}

.sk small{
  font-size:11px;

  color:#7f8fb3;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;

  top:
    calc(
      12px +
      env(safe-area-inset-top,0)
    );

  left:50%;

  transform:
    translateX(-50%)
    translateY(-20px);

  z-index:100;

  background:
    rgba(12,25,52,.96);

  border:1px solid #3a5a9a;

  color:#e8eefc;

  padding:10px 18px;

  border-radius:14px;

  font-size:14px;

  font-weight:600;

  opacity:0;

  pointer-events:none;

  transition:
    opacity .25s,
    transform .25s;

  max-width:90%;

  text-align:center;

  box-shadow:
    0 8px 28px rgba(0,0,0,.45);
}

.toast.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}
