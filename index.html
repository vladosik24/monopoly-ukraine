<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Монополія Україна</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Nunito:wght@600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body[data-theme="classic"] { --bg-dark: #0a1f1a; --bg-main: #0d2924; --bg-panel: #154038; --accent: #2dd4bf; --accent2: #14b8a6; --gold: #fbbf24; --red: #ef4444; --green: #22c55e; --blue: #3b82f6; --text: #f1f5f9; --sub: #94a3b8; }
        body[data-theme="fruit"] { --bg-dark: #1a2a1a; --bg-main: #1e3a1e; --bg-panel: #2a4a2a; --accent: #f97316; --accent2: #ea580c; --gold: #facc15; --red: #ef4444; --green: #22c55e; --blue: #3b82f6; --text: #f1f5f9; --sub: #cbd5e1; }
        body[data-theme="city"] { --bg-dark: #0a0f1e; --bg-main: #0d1a3a; --bg-panel: #1a2a5a; --accent: #3b82f6; --accent2: #2563eb; --gold: #fbbf24; --red: #ef4444; --green: #22c55e; --blue: #3b82f6; --text: #f1f5f9; --sub: #94a3b8; }
        body[data-theme="dark"] { --bg-dark: #0a0a0a; --bg-main: #111827; --bg-panel: #1f2937; --accent: #06b6d4; --accent2: #0891b2; --gold: #fbbf24; --red: #ef4444; --green: #22c55e; --blue: #3b82f6; --text: #f9fafb; --sub: #9ca3af; }
        body[data-theme="purple"] { --bg-dark: #0d0a1f; --bg-main: #130d2e; --bg-panel: #1e1245; --accent: #a78bfa; --accent2: #7c3aed; --gold: #fbbf24; --red: #ef4444; --green: #22c55e; --blue: #818cf8; --text: #f5f3ff; --sub: #a5b4fc; }
        html, body { height: 100%; font-family: 'Nunito', sans-serif; background: var(--bg-dark); color: var(--text); min-height: 100dvh; overflow: hidden; }
        input, textarea, select { font-size: 16px !important; }
        .screen { display: none; flex-direction: column; min-height: 100dvh; position: relative; z-index: 1; }
        .screen.active { display: flex; }
        #s-main { background: var(--bg-dark); overflow-y: auto; padding-bottom: 70px; }
        .main-header { background: linear-gradient(180deg, var(--bg-panel), var(--bg-main)); padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 2px solid var(--accent2); }
        .prof-av { width: 50px; height: 50px; border-radius: 50%; border: 3px solid var(--gold); box-shadow: 0 0 12px rgba(251,191,36,.4); overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; background: var(--bg-panel); color: var(--gold); cursor: pointer; transition: .2s; }
        .prof-av:active { transform: scale(.9); }
        .prof-av img { width: 100%; height: 100%; object-fit: cover; }
        .prof-info { flex: 1; min-width: 0; }
        .prof-name { font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 900; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .prof-sub { font-size: 10px; color: var(--sub); margin-top: 2px; }
        .gold-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(251,191,36,.12); border: 1px solid rgba(251,191,36,.3); border-radius: 10px; padding: 3px 8px; font-size: 11px; font-weight: 700; color: var(--gold); margin-top: 3px; }
        .clan-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(45,212,191,.12); border: 1px solid rgba(45,212,191,.3); border-radius: 10px; padding: 3px 8px; font-size: 11px; font-weight: 700; color: var(--accent); margin-top: 3px; margin-left: 6px; }
        .main-tabs { display: flex; border-bottom: 1px solid rgba(45,212,191,.2); background: rgba(0,0,0,.2); padding: 0 6px; overflow-x: auto; flex-shrink: 0; }
        .main-tabs::-webkit-scrollbar { display: none; }
        .mtab { padding: 10px 14px; border: none; background: transparent; color: var(--sub); font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; border-bottom: 2.5px solid transparent; white-space: nowrap; transition: .2s; }
        .mtab.on { color: var(--gold); border-bottom-color: var(--gold); }
        .tc { flex: 1; overflow-y: auto; padding-bottom: 16px; }
        .rooms-hdr { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 6px; }
        .rooms-lbl { font-family: 'Unbounded', sans-serif; font-size: 10px; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: .5px; }
        .ref-btn { background: rgba(45,212,191,.1); border: 1px solid var(--accent2); border-radius: 7px; padding: 5px 10px; color: var(--accent); font-size: 13px; cursor: pointer; }
        .room-row { display: flex; align-items: center; padding: 12px 14px; border-bottom: 1px solid rgba(45,212,191,.1); cursor: pointer; gap: 10px; transition: .15s; }
        .room-row:active { background: rgba(45,212,191,.05); }
        .slots { display: flex; gap: 6px; flex: 1; align-items: center; }
        .slot { width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(45,212,191,.2); background: rgba(45,212,191,.05); display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; position: relative; }
        .slot.filled { border-color: rgba(45,212,191,.5); }
        .slot img { width: 100%; height: 100%; object-fit: cover; }
        .slot-ltr { font-size: 16px; font-weight: 800; color: rgba(255,255,255,.5); }
        .slot.empty .slot-ltr { font-size: 22px; color: rgba(255,255,255,.1); }
        .row-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .arr { font-size: 24px; font-weight: 900; color: var(--gold); }
        .lgstrip { display: flex; gap: 8px; padding: 10px 14px; overflow-x: auto; }
        .lgico { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; border: 3px solid transparent; transition: .2s; background: rgba(45,212,191,.05); flex-shrink: 0; }
        .lgico.active { border-color: var(--gold); background: rgba(251,191,36,.1); box-shadow: 0 0 10px rgba(251,191,36,.3); }
        .lg-hdr { background: linear-gradient(135deg, rgba(45,212,191,.2), rgba(45,212,191,.06)); border: 1px solid var(--accent2); border-radius: 14px; padding: 14px; margin: 6px 14px 10px; }
        .lg-title { font-family: 'Unbounded', sans-serif; font-size: 14px; font-weight: 900; color: var(--gold); }
        .lg-desc { font-size: 11px; color: var(--sub); margin-top: 5px; }
        .rank-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid rgba(45,212,191,.05); }
        .rank-row.me { background: rgba(251,191,36,.07); }
        .rnum { width: 24px; font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 900; color: var(--sub); text-align: center; }
        .rnum.g { color: #ffd700; } .rnum.s { color: #c0c0c0; } .rnum.b { color: #cd7f32; }
        .rav { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; border: 2px solid; overflow: hidden; flex-shrink: 0; }
        .rav img { width: 100%; height: 100%; object-fit: cover; }
        .ri { flex: 1; min-width: 0; }
        .rname { font-weight: 800; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rsub { font-size: 10px; color: var(--sub); margin-top: 1px; }
        .rscore { font-family: 'Unbounded', sans-serif; font-size: 16px; font-weight: 900; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: flex-end; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
        .overlay.on { display: flex; }
        .sheet { background: var(--bg-main); border-radius: 20px 20px 0 0; width: 100%; max-width: 480px; padding: 18px 16px 32px; max-height: 92vh; overflow-y: auto; }
        .sh-handle { width: 40px; height: 4px; background: rgba(255,255,255,.2); border-radius: 2px; margin: 0 auto 14px; }
        .sh-title { font-family: 'Unbounded', sans-serif; font-size: 15px; font-weight: 900; color: var(--gold); text-align: center; margin-bottom: 14px; }
        .mg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .mc { background: rgba(45,212,191,.05); border: 1.5px solid rgba(45,212,191,.2); border-radius: 12px; padding: 13px 10px; text-align: center; cursor: pointer; transition: .18s; }
        .mc:active { transform: scale(.95); }
        .mc.on { border-color: var(--gold); background: rgba(251,191,36,.08); }
        .me-ic { font-size: 24px; margin-bottom: 3px; }
        .mn { font-family: 'Unbounded', sans-serif; font-size: 10px; font-weight: 700; }
        .md { font-size: 10px; color: var(--sub); margin-top: 2px; }
        label.lbl { font-size: 10px; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 5px; display: block; }
        input, select { width: 100%; padding: 11px 14px; background: rgba(45,212,191,.07); border: 1.5px solid rgba(45,212,191,.2); border-radius: 11px; color: var(--text); font-size: 14px; font-weight: 600; outline: none; margin-bottom: 9px; }
        input:focus, select:focus { border-color: var(--gold); }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 11px; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800; cursor: pointer; transition: .18s; margin-bottom: 7px; }
        .btn:active { transform: scale(.97); }
        .b-gold { background: linear-gradient(135deg, var(--gold), #f59e0b); color: var(--bg-dark); }
        .b-green { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; }
        .b-surf { background: rgba(45,212,191,.07); border: 1.5px solid rgba(45,212,191,.2); color: var(--text); }
        .b-red { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .clan-compact { padding: 10px 14px; }
        .clan-section { background: rgba(45,212,191,.05); border: 1px solid rgba(45,212,191,.15); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
        .clan-chat-msgs { height: 120px; overflow-y: auto; background: rgba(0,0,0,.2); border-radius: 8px; padding: 8px; margin-bottom: 8px; font-size: 12px; }
        .clan-chat-msg { margin: 3px 0; padding: 4px 6px; background: rgba(45,212,191,.08); border-radius: 5px; }
        .jp { background: var(--green); border: none; border-radius: 6px; padding: 5px 12px; color: white; font-size: 11px; font-weight: 700; cursor: pointer; }
        .jp:active { transform: scale(.95); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 62px; background: var(--bg-panel); border-top: 1.5px solid rgba(45,212,191,.25); display: flex; align-items: stretch; z-index: 50; max-width: 480px; margin: 0 auto; box-shadow: 0 -4px 20px rgba(0,0,0,.4); }
        .bnav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: none; background: transparent; color: var(--sub); cursor: pointer; font-family: 'Nunito', sans-serif; font-size: 9px; font-weight: 700; transition: .2s; position: relative; padding: 6px 0; }
        .bnav-btn:active { transform: scale(.9); }
        .bnav-btn.on { color: var(--gold); }
        .bnav-btn.on .bnav-ico { background: rgba(251,191,36,.15); border-radius: 10px; }
        .bnav-ico { font-size: 22px; width: 36px; height: 28px; display: flex; align-items: center; justify-content: center; transition: .2s; }
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1e1040; border: 1px solid rgba(255,255,255,.18); border-radius: 12px; padding: 10px 18px; font-size: 13px; font-weight: 700; z-index: 9999; transition: transform .3s; white-space: nowrap; max-width: 85vw; word-break: break-word; text-align: center; }
        .toast.on { transform: translateX(-50%) translateY(0); }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--accent2); border-radius: 2px; }
    </style>
</head>
<body data-theme="classic">

    <!-- MAIN SCREEN -->
    <div id="s-main" class="screen active">
        <div class="main-header">
            <div style="display:flex;align-items:center;gap:9px;flex:1;min-width:0">
                <div class="prof-av" id="profAv" onclick="openProfile()">?</div>
                <div class="prof-info">
                    <div class="prof-name" id="profName">Гравець</div>
                    <div class="prof-sub" id="profLeague">🥉 Новачок</div>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:3px">
                        <div class="gold-badge">🪙 <span id="goldAmt">0</span></div>
                        <div class="clan-badge">🏰 <span id="clanBadge">—</span></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="main-tabs">
            <button class="mtab on" onclick="mTab('games',this)">🎮 ІГРИ</button>
            <button class="mtab" onclick="mTab('active',this)">⚡ ПОЧАТІ</button>
            <button class="mtab" onclick="mTab('league',this)">🏆 ЛІГИ</button>
            <button class="mtab" onclick="mTab('clans',this)">🏰 КЛАНИ</button>
            <button class="mtab" onclick="mTab('daily',this)">📅 БОНУС</button>
        </div>
        <div class="tc" id="tc-games"><div class="rooms-hdr"><span class="rooms-lbl">Відкриті кімнати</span><button class="ref-btn" onclick="loadRooms()">↺</button></div><div id="roomsList"><div style="text-align:center;padding:40px;color:var(--sub)">⏳</div></div></div>
        <div class="tc" id="tc-active" style="display:none"><div class="rooms-hdr"><span class="rooms-lbl">Мої кімнати</span><button class="ref-btn" onclick="loadMyRooms()">↺</button></div><div id="myRoomsList"></div></div>
        <div class="tc" id="tc-league" style="display:none"><div class="lgstrip" id="lgstrip"></div><div id="lgHdr"></div><div id="lgList"></div></div>
        <div class="tc" id="tc-clans" style="display:none"><div id="clansContent"><div style="text-align:center;padding:40px;color:var(--sub)">⏳</div></div></div>
        <div class="tc" id="tc-daily" style="display:none"><div style="padding:16px 14px" id="dailyContent"></div></div>
        <nav class="bottom-nav">
            <button class="bnav-btn on" id="bn-games" onclick="bnav('games',this)"><div class="bnav-ico">🎮</div><span>ІГРИ</span></button>
            <button class="bnav-btn" id="bn-league" onclick="bnav('league',this)"><div class="bnav-ico">🏆</div><span>ЛІГИ</span></button>
            <button class="bnav-btn" style="position:relative" onclick="openCreate()"><div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#f59e0b);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:var(--bg-dark);box-shadow:0 4px 16px rgba(251,191,36,.55);position:absolute;top:-20px;border:3px solid var(--bg-dark)">+</div><div style="margin-top:26px;font-size:9px;font-weight:800;color:var(--gold)">НОВА ГРА</div></button>
            <button class="bnav-btn" id="bn-clans" onclick="bnav('clans',this)"><div class="bnav-ico">🏰</div><span>КЛАНИ</span></button>
            <button class="bnav-btn" id="bn-settings" onclick="openSettings()"><div class="bnav-ico">⚙️</div><span>БІЛЬШЕ</span></button>
        </nav>
    </div>

    <!-- Modals -->
    <div class="overlay" id="createModal">
        <div class="sheet">
            <div class="sh-handle"></div>
            <div class="sh-title">Нова гра</div>
            <label class="lbl">Ваше ім'я</label>
            <input id="pN" placeholder="Введіть ім'я" maxlength="20">
            <button class="btn b-gold" onclick="createRoom()">✅ Створити кімнату</button>
            <button class="btn b-surf" onclick="closeCreate()">❌ Скасувати</button>
        </div>
    </div>

    <div class="overlay" id="settingsModal">
        <div class="sheet">
            <div class="sh-handle"></div>
            <div class="sh-title">Налаштування</div>
            <button class="btn b-surf" onclick="closeSettings()">Закрити</button>
        </div>
    </div>

    <div class="overlay" id="profileModal">
        <div class="sheet">
            <div class="sh-handle"></div>
            <div class="sh-title">Профіль</div>
            <button class="btn b-surf" onclick="closeProfile()">Закрити</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ===== TELEGRAM =====
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#0a1f1a'); tg.setBackgroundColor('#0a1f1a') }
        const TGU = tg?.initDataUnsafe?.user;
        const myId = (() => {
            if (TGU?.id) return 'tg_' + TGU.id;
            let id = localStorage.getItem('mono_uid');
            if (!id) { id = 'p' + Date.now() + Math.random().toString(36).substr(2, 4); localStorage.setItem('mono_uid', id) }
            return id;
        })();
        
        // Отримуємо аватарку з Telegram
        const myAvatar = TGU?.photo_url || null;
        
        function hp(t = 'light') { if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred(t) }

        // ===== FIREBASE =====
        const FBC = { apiKey: "AIzaSyByYh0VOBkFvPcQYRzabrt8sfj32gpbsWQ", authDomain: "monopoly-ukraine.firebaseapp.com", databaseURL: "https://monopoly-ukraine-default-rtdb.europe-west1.firebasedatabase.app", projectId: "monopoly-ukraine" };
        let db = null;
        function initFirebase() {
            return new Promise(resolve => {
                if (window.firebase && firebase.database) { try { firebase.initializeApp(FBC); db = firebase.database(); resolve(); } catch (e) { resolve(); } return; }
                const s1 = document.createElement('script'); s1.src = 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js';
                s1.onload = () => {
                    const s2 = document.createElement('script'); s2.src = 'https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js';
                    s2.onload = () => { try { firebase.initializeApp(FBC); db = firebase.database(); } catch (e) {} resolve(); };
                    document.body.appendChild(s2);
                };
                document.body.appendChild(s1);
            });
        }

        // ===== CONFIGURATION =====
        const LEAGUES = [
            { name: 'Новачок', icon: '🥉', min: 0, color: '#cd7f32' },
            { name: 'Любитель', icon: '🥈', min: 500, color: '#c0c0c0' },
            { name: 'Профі', icon: '🥇', min: 1500, color: '#ffd700' },
            { name: 'Магнат', icon: '💎', min: 3000, color: '#3b82f6' },
            { name: 'Легенда', icon: '👑', min: 6000, color: '#a78bfa' }
        ];
        function getLeague(s) { let l = LEAGUES[0]; for (const lg of LEAGUES) { if (s >= lg.min) l = lg } return l }
        const COLORS = ['#3b82f6', '#ef4444', '#22c55e', '#f59e0b'];

        // ===== GLOBAL STATE =====
        let myRoom = null, myName = 'Гравець', myScore = 0, myWins = 0, myGold = 0, myClan = null, clanChatListener = null;
        let selectedLeague = 0;

        // ===== UI HELPERS =====
        function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active') }
        function toast(msg, ms = 2500) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), ms) }
        function openCreate() { document.getElementById('createModal').classList.add('on') }
        function closeCreate() { document.getElementById('createModal').classList.remove('on') }
        function openSettings() { document.getElementById('settingsModal').classList.add('on') }
        function closeSettings() { document.getElementById('settingsModal').classList.remove('on') }
        function openProfile() { document.getElementById('profileModal').classList.add('on') }
        function closeProfile() { document.getElementById('profileModal').classList.remove('on') }
        function bnav(tab, el) { document.querySelectorAll('.bnav-btn').forEach(b => b.classList.remove('on')); el.classList.add('on'); mTab(tab, document.querySelector(`.mtab[onclick*="${tab}"]`)) }

        function mTab(n, el) {
            document.querySelectorAll('.mtab').forEach(t => t.classList.remove('on'));
            el.classList.add('on');
            ['games', 'active', 'league', 'clans', 'daily'].forEach(x => {
                const tc = document.getElementById('tc-' + x);
                if (tc) tc.style.display = x === n ? 'block' : 'none';
            });
            if (n === 'league') renderLeagueStrip();
            if (n === 'games') loadRooms();
            if (n === 'active') loadMyRooms();
            if (n === 'clans') loadClans();
            if (n === 'daily') renderDailyBonus();
        }

        // ===== ROOMS =====
        async function createRoom() {
            if (!db) { toast('❌ Помилка бази даних'); return; }
            const name = document.getElementById('pN').value.trim() || myName;
            myName = name;
            const roomId = 'GAME-' + Math.random().toString(36).substr(2, 4).toUpperCase();
            await db.ref('rooms/' + roomId).set({
                mode: 'classic',
                map: 'classic',
                players: { [myId]: { id: myId, name: myName, color: COLORS[0], money: 15000000, pos: 0, props: [], houses: {}, mortgaged: [], inJail: false, jailTurns: 0, bankrupt: false, avatar: myAvatar } },
                game: { current: 0, started: false, turn: 0 },
                createdAt: Date.now(),
                ownerId: myId
            });
            await db.ref('players/' + myId).update({ name: myName, lastRoom: roomId, avatar: myAvatar });
            myRoom = roomId;
            closeCreate();
            toast('✅ Кімнату створено! Код: ' + roomId);
            loadRooms();
        }

        async function loadRooms() {
            if (!db) return;
            const container = document.getElementById('roomsList');
            container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--sub)">⏳ Завантаження...</div>';
            const snap = await db.ref('rooms').orderByChild('createdAt').limitToLast(20).once('value');
            const rooms = snap.val() || {};
            const list = Object.entries(rooms).filter(([id, r]) => !r.game?.started && r.players && Object.keys(r.players).length < 4).reverse();
            if (list.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--sub)">Немає відкритих кімнат</div>';
                return;
            }
            container.innerHTML = list.map(([id, r]) => {
                const players = Object.values(r.players || {});
                const slots = Array(4).fill(0).map((_, i) => {
                    const p = players[i];
                    if (p) {
                        const avatarHtml = p.avatar ? `<img src="${p.avatar}" alt="">` : `<div class="slot-ltr">${p.name[0]}</div>`;
                        return `<div class="slot filled" style="border-color:${p.color}">${avatarHtml}</div>`;
                    }
                    return `<div class="slot empty"><div class="slot-ltr">+</div></div>`;
                }).join('');
                return `<div class="room-row" onclick="joinRoom('${id}')"><div class="slots">${slots}</div><div class="row-right"><div class="arr">→</div></div></div>`;
            }).join('');
        }

        async function loadMyRooms() {
            if (!db) return;
            const container = document.getElementById('myRoomsList');
            container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--sub)">⏳</div>';
            const snap = await db.ref('rooms').orderByChild('ownerId').equalTo(myId).once('value');
            const rooms = snap.val() || {};
            const list = Object.entries(rooms);
            if (list.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--sub)">У вас немає кімнат</div>';
                return;
            }
            container.innerHTML = list.map(([id, r]) => {
                const players = Object.values(r.players || {});
                const slots = Array(4).fill(0).map((_, i) => {
                    const p = players[i];
                    if (p) {
                        const avatarHtml = p.avatar ? `<img src="${p.avatar}" alt="">` : `<div class="slot-ltr">${p.name[0]}</div>`;
                        return `<div class="slot filled" style="border-color:${p.color}">${avatarHtml}</div>`;
                    }
                    return `<div class="slot empty"><div class="slot-ltr">+</div></div>`;
                }).join('');
                return `<div class="room-row" onclick="joinRoom('${id}')"><div class="slots">${slots}</div><div class="row-right"><button class="ref-btn" style="color:var(--red)" onclick="event.stopPropagation();deleteRoom('${id}')">🗑</button><div class="arr">→</div></div></div>`;
            }).join('');
        }

        async function deleteRoom(id) {
            if (!confirm('Видалити кімнату?')) return;
            await db.ref('rooms/' + id).remove();
            loadMyRooms();
        }

        async function joinRoom(id) {
            if (!db) return;
            const snap = await db.ref('rooms/' + id).once('value');
            const r = snap.val();
            if (!r) { toast('❌ Кімната не знайдена'); return; }
            if (r.game?.started) { toast('⚠️ Гра вже почалася'); return; }
            const players = Object.values(r.players || {});
            if (players.length >= 4) { toast('❌ Кімната заповнена'); return; }
            const myIdx = players.length;
            await db.ref('rooms/' + id + '/players/' + myId).set({
                id: myId,
                name: myName,
                color: COLORS[myIdx],
                money: 15000000,
                pos: 0,
                props: [],
                houses: {},
                mortgaged: [],
                inJail: false,
                jailTurns: 0,
                bankrupt: false,
                avatar: myAvatar
            });
            myRoom = id;
            toast('✅ Ви приєдналися до кімнати!');
            loadRooms();
        }

        // ===== LEAGUE =====
        async function renderLeagueStrip() {
            const container = document.getElementById('lgstrip');
            container.innerHTML = LEAGUES.map((lg, i) => `<div class="lgico ${selectedLeague === i ? 'active' : ''}" onclick="selectLeague(${i})">${lg.icon}</div>`).join('');
            const curLg = LEAGUES[selectedLeague];
            document.getElementById('lgHdr').innerHTML = `<div class="lg-hdr"><div class="lg-title">${curLg.icon} ${curLg.name}</div><div class="lg-desc">Потрібно від ${curLg.min} очок</div></div>`;
            const snap = await db.ref('players').orderByChild('score').limitToLast(20).once('value');
            const players = Object.entries(snap.val() || {}).map(([id, p]) => ({ id, ...p })).reverse();
            document.getElementById('lgList').innerHTML = players.map((p, i) => {
                const avatarHtml = p.avatar ? `<img src="${p.avatar}" alt="">` : `${(p.name || 'Гравець')[0]}`;
                return `
                <div class="rank-row ${p.id === myId ? 'me' : ''}">
                    <div class="rnum ${i === 0 ? 'g' : i === 1 ? 's' : i === 2 ? 'b' : ''}">${i + 1}</div>
                    <div class="rav" style="border-color:${COLORS[i % 4]};background:${COLORS[i % 4]}20;color:${COLORS[i % 4]}">${avatarHtml}</div>
                    <div class="ri"><div class="rname">${p.name || 'Гравець'}</div><div class="rsub">${getLeague(p.score || 0).icon} ${getLeague(p.score || 0).name}</div></div>
                    <div class="rscore" style="color:${getLeague(p.score || 0).color}">${p.score || 0}</div>
                </div>
            `}).join('');
        }

        function selectLeague(idx) {
            selectedLeague = idx;
            renderLeagueStrip();
        }

        // ===== CLANS =====
        async function loadClans() {
            const container = document.getElementById('clansContent');
            if (!container) return;
            container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--sub)">⏳</div>';
            if (!db) return;
            const userSnap = await db.ref(`players/${myId}`).once('value');
            const user = userSnap.val() || {};
            myClan = user.clanId || null;
            if (myClan) {
                const cs = await db.ref(`clans/${myClan}/name`).once('value');
                document.getElementById('clanBadge').textContent = cs.val() || 'Клан';
            } else {
                document.getElementById('clanBadge').textContent = '—';
            }
            const clansSnap = await db.ref('clans').once('value');
            const clans = clansSnap.val() || {};
            const clansList = Object.entries(clans).map(([id, data]) => ({ id, ...data }));
            let html = `<div class="clan-compact"><button class="btn b-gold" style="margin-bottom:10px" onclick="showCreateClan()">➕ Створити клан</button>`;
            if (myClan && clans[myClan]) {
                const cd = clans[myClan];
                html += `
                <div class="clan-section">
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
                        <div><strong>🏰 ${cd.name}</strong> <span style="font-size:10px;color:var(--sub)">[${cd.tag}]</span></div>
                        <div style="font-size:11px;color:var(--sub)">👥 ${cd.members?.length || 0}</div>
                    </div>
                    <div style="font-size:11px;color:var(--sub);margin-bottom:10px">👑 ${cd.ownerName}</div>
                    <div style="display:flex;gap:6px;margin-bottom:10px">
                        <button class="btn b-surf" style="padding:8px;font-size:12px;margin-bottom:0;flex:1" onclick="leaveClan()">Покинути</button>
                        ${cd.ownerId === myId ? `<button class="btn b-red" style="padding:8px;font-size:12px;margin-bottom:0;flex:1" onclick="deleteClan('${myClan}')">🗑</button>` : ''}
                    </div>
                    <div style="margin-top:10px;border-top:1px solid rgba(45,212,191,.15);padding-top:10px">
                        <div style="font-size:11px;font-weight:700;color:var(--sub);margin-bottom:6px">💬 Чат клану</div>
                        <div id="clanChatMessages" class="clan-chat-msgs"></div>
                        <div style="display:flex;gap:6px">
                            <input id="clanChatInput" style="flex:1;padding:8px 10px;font-size:12px" placeholder="Повідомлення..." maxlength="100" onkeydown="if(event.key==='Enter')sendClanChat()">
                            <button class="btn b-gold" style="margin:0;width:auto;padding:8px 14px" onclick="sendClanChat()">➤</button>
                        </div>
                    </div>
                </div>`;
                listenClanChat(myClan);
            } else {
                if (clansList.length === 0) html += `<div style="text-align:center;color:var(--sub);padding:20px">Немає кланів</div>`;
                else clansList.forEach(clan => {
                    html += `
                    <div class="room-row" style="border-radius:10px;margin-bottom:8px;justify-content:space-between">
                        <div><strong>${clan.name}</strong> <span style="font-size:10px;color:var(--sub)">[${clan.tag}]</span></div>
                        <div style="display:flex;align-items:center;gap:8px">
                            <div style="font-size:11px;color:var(--sub)">👥 ${clan.members?.length || 0}</div>
                            <button class="jp" onclick="joinClan('${clan.id}')">→</button>
                        </div>
                    </div>`;
                });
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        function showCreateClan() {
            if (myClan) { toast('⚠️ Ви вже в клані! Спочатку покиньте поточний.'); return; }
            const name = prompt('Назва клану', '');
            if (!name) return;
            const tag = prompt('Тег (2-5 символів)', '').toUpperCase();
            if (!tag) return;
            createClan(name, tag);
        }

        async function createClan(name, tag) {
            if (!db) return;
            if (myClan) { toast('⚠️ Ви вже перебуваєте в клані'); return; }
            try {
                const clanId = 'clan_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                await db.ref(`clans/${clanId}`).set({
                    name: name.slice(0, 20), tag: tag.slice(0, 5), ownerId: myId, ownerName: myName,
                    members: [myId], createdAt: Date.now()
                });
                await db.ref(`players/${myId}/clanId`).set(clanId);
                toast(`Клан ${name} створено!`);
                loadClans();
            } catch (e) { toast('❌ Помилка створення клану'); }
        }

        async function joinClan(clanId) {
            if (!db) return;
            if (myClan) { toast('⚠️ Ви вже в клані'); return; }
            try {
                const cs = await db.ref(`clans/${clanId}`).once('value');
                const clan = cs.val();
                if (!clan) { toast('Клан не знайдено'); return; }
                const members = clan.members || [];
                if (members.length >= 30) { toast('Клан заповнений'); return; }
                if (members.includes(myId)) { toast('Ви вже в цьому клані'); return; }
                members.push(myId);
                await db.ref(`clans/${clanId}/members`).set(members);
                await db.ref(`players/${myId}/clanId`).set(clanId);
                toast('Ви приєдналися до клану!');
                loadClans();
            } catch (e) { toast('❌ Помилка приєднання'); }
        }

        async function leaveClan() {
            if (!db || !myClan) return;
            try {
                const cs = await db.ref(`clans/${myClan}`).once('value');
                const clan = cs.val();
                if (!clan) return;
                let members = (clan.members || []).filter(id => id !== myId);
                await db.ref(`clans/${myClan}/members`).set(members);
                await db.ref(`players/${myId}/clanId`).remove();
                if (clan.ownerId === myId && members.length > 0) {
                    await db.ref(`clans/${myClan}/ownerId`).set(members[0]);
                    const ns = await db.ref(`players/${members[0]}/name`).once('value');
                    await db.ref(`clans/${myClan}/ownerName`).set(ns.val() || 'Гравець');
                }
                if (clanChatListener) {
                    db.ref(`clanChat/${myClan}`).off('value', clanChatListener);
                    clanChatListener = null;
                }
                toast('Ви покинули клан');
                loadClans();
            } catch (e) { toast('❌ Помилка'); }
        }

        async function deleteClan(clanId) {
            if (!confirm('Видалити клан назавжди?')) return;
            if (!db) return;
            try {
                const cs = await db.ref(`clans/${clanId}`).once('value');
                const clan = cs.val();
                if (!clan || clan.ownerId !== myId) { toast('❌ Немає прав'); return; }
                for (let mid of clan.members || []) {
                    await db.ref(`players/${mid}/clanId`).remove();
                }
                await db.ref(`clans/${clanId}`).remove();
                await db.ref(`clanChat/${clanId}`).remove();
                if (clanChatListener) {
                    db.ref(`clanChat/${clanId}`).off('value', clanChatListener);
                    clanChatListener = null;
                }
                toast('Клан видалено');
                loadClans();
            } catch (e) { toast('❌ Помилка видалення'); }
        }

        // ===== CLAN CHAT =====
        function listenClanChat(clanId) {
            if (!db) return;
            if (clanChatListener) {
                db.ref(`clanChat/${clanId}`).off('value', clanChatListener);
            }
            clanChatListener = db.ref(`clanChat/${clanId}`).limitToLast(30).on('value', snap => {
                const msgs = snap.val();
                const container = document.getElementById('clanChatMessages');
                if (!container) return;
                if (!msgs) { container.innerHTML = '<div style="color:var(--sub);text-align:center;padding:10px">Повідомлень немає</div>'; return; }
                container.innerHTML = Object.values(msgs).sort((a, b) => a.ts - b.ts).map(m => {
                    const isMe = m.uid === myId;
                    return `<div class="clan-chat-msg" style="${isMe ? 'background:rgba(251,191,36,.1);text-align:right' : ''}"><strong style="color:${m.color || '#2dd4bf'}">${m.name}:</strong> ${m.text}</div>`;
                }).join('');
                container.scrollTop = container.scrollHeight;
            });
        }

        async function sendClanChat() {
            if (!myClan || !db) return;
            const inp = document.getElementById('clanChatInput');
            const text = inp.value.trim();
            if (!text) return;
            inp.value = '';
            await db.ref(`clanChat/${myClan}`).push({ uid: myId, name: myName, color: COLORS[0], text, ts: Date.now() });
        }

        // ===== DAILY BONUS =====
        const DAILY_REWARDS = [50, 75, 100, 150, 200, 300, 500];
        async function renderDailyBonus() {
            const container = document.getElementById('dailyContent');
            if (!container) return;
            const now = Date.now();
            const last = parseInt(localStorage.getItem('daily_last') || '0');
            const streak = parseInt(localStorage.getItem('daily_streak') || '0');
            const dayMs = 86400000;
            const elapsed = now - last;
            const canClaim = elapsed >= dayMs;
            const streakBroken = elapsed > dayMs * 2;
            const currentStreak = streakBroken ? 0 : streak;
            const todayIdx = Math.min(currentStreak, 6);
            const reward = DAILY_REWARDS[todayIdx];
            let dots = '';
            for (let i = 0; i < 7; i++) {
                const done = i < currentStreak;
                const isToday = i === currentStreak && canClaim;
                dots += `<div style="width:30px;height:30px;border-radius:50%;background:${done ? 'rgba(251,191,36,.3)' : 'rgba(255,255,255,.1)'};border:2px solid ${isToday ? 'white' : done ? 'var(--gold)' : 'rgba(255,255,255,.2)'};display:flex;align-items:center;justify-content:center;font-size:12px">${done ? '✓' : DAILY_REWARDS[i] + '🪙'}</div>`;
            }
            container.innerHTML = `
                <div style="background:linear-gradient(135deg, rgba(251,191,36,.15), rgba(45,212,191,.1));border:2px solid var(--gold);border-radius:14px;padding:16px;text-align:center">
                    <div style="font-size:12px;color:var(--sub);margin-bottom:4px">Щоденний бонус</div>
                    <div style="font-family:'Unbounded',sans-serif;font-size:28px;font-weight:900;color:var(--gold)">${currentStreak} 🔥</div>
                    <div style="font-size:11px;color:var(--sub);margin-bottom:8px">днів поспіль</div>
                    <div style="display:flex;gap:6px;justify-content:center;margin:10px 0">${dots}</div>
                    <div style="font-size:13px;font-weight:800;margin:10px 0">Сьогодні: <span style="color:var(--gold)">${reward} 🪙</span></div>
                    ${canClaim ? `<button class="btn b-gold" onclick="claimDaily(${reward},${currentStreak})">🎁 Отримати бонус!</button>` : `<div style="color:var(--sub);font-size:12px;margin-top:8px">⏰ Наступний через ${Math.ceil((dayMs - elapsed) / 3600000)}г</div>`}
                </div>`;
        }

        async function claimDaily(reward, streak) {
            const newStreak = streak + 1;
            localStorage.setItem('daily_last', Date.now().toString());
            localStorage.setItem('daily_streak', newStreak.toString());
            myGold += reward;
            if (db) await db.ref('players/' + myId + '/gold').set(myGold);
            document.getElementById('goldAmt').textContent = myGold;
            toast(`🎁 +${reward} 🪙 Стрік: ${newStreak} 🔥`);
            hp('heavy');
            renderDailyBonus();
        }

        // ===== INIT =====
        async function onReady() {
            await initFirebase();
            if (db) {
                const snap = await db.ref('players/' + myId).once('value');
                const p = snap.val() || {};
                myName = p.name || TGU?.first_name || 'Гравець';
                myScore = p.score || 0;
                myWins = p.wins || 0;
                myGold = p.gold || 0;
            }
            document.getElementById('profName').textContent = myName;
            document.getElementById('goldAmt').textContent = myGold;
            
            // Встановлюємо аватарку з Telegram
            const profAv = document.getElementById('profAv');
            if (myAvatar) {
                profAv.innerHTML = `<img src="${myAvatar}" alt="">`;
            } else {
                profAv.textContent = myName[0];
            }
            
            const lg = getLeague(myScore);
            document.getElementById('profLeague').textContent = lg.icon + ' ' + lg.name;
            
            loadRooms();
            const last = parseInt(localStorage.getItem('daily_last') || '0');
            if (Date.now() - last >= 86400000) {
                setTimeout(() => toast('🎁 Є щоденний бонус! Вкладка "📅 БОНУС"', 4000), 1500);
            }
        }

        onReady();
    </script>
</body>
</html>
