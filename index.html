<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Монополія Україна</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#050b19;
  --bg2:#09152c;
  --panel:#0d1b35;
  --panel2:#101f3d;
  --line:#263b68;
  --gold:#ffd447;
  --gold2:#e5a900;
  --blue:#3c91ff;
  --cyan:#43d9ff;
  --green:#2ee67a;
  --red:#ff5964;
  --white:#f4f7ff;
  --muted:#8394b8;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding-top:env(safe-area-inset-top,0);
  padding-bottom:env(safe-area-inset-bottom,0);
  background:
    radial-gradient(circle at 50% -10%,#193c73 0%,transparent 38%),
    radial-gradient(circle at 0% 100%,#101f45 0%,transparent 35%),
    var(--bg);
  color:var(--white);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100%;
}

body{
  overflow-x:hidden;
}

button,
input,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

/* =========================================================
   GAME — ОСНОВНІ СТИЛІ, МЕХАНІКА НЕ ЗМІНЮЄТЬСЯ
========================================================= */

#app{
  max-width:480px;
  margin:0 auto;
  padding:6px 6px 12px;
}

#top{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-bottom:8px;
}

.pl{
  position:relative;
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px;
  border:2px solid var(--c);
  border-radius:10px;
  background:var(--panel);
  min-width:0;
}

.pl.on{
  box-shadow:0 0 12px var(--c),inset 0 0 8px var(--c);
}

.pl.dead{
  opacity:.45;
  border-color:var(--line);
}

.av{
  position:relative;
  flex:none;
  width:30px;
  height:30px;
  border-radius:50%;
  border:2px solid var(--c);
  display:grid;
  place-items:center;
  font-size:16px;
  background:#16264a;
  overflow:visible;
}

.av img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

.av::after{
  content:'';
  position:absolute;
  inset:-3px;
  background:var(--fi,none) center/100% 100% no-repeat;
  pointer-events:none;
  border-radius:50%;
}

.av[data-b]::before{
  content:attr(data-b);
  position:absolute;
  top:-7px;
  right:-7px;
  font-size:12px;
  z-index:3;
  line-height:1;
}

.pl div{
  min-width:0;
  font-size:11px;
  line-height:1.25;
}

.pl b{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.pl span{
  color:var(--green);
  font-weight:700;
  font-size:12px;
}

.pl.dead span{
  color:#c66;
  font-size:9px;
}

.tm{
  position:absolute;
  top:-6px;
  right:4px;
  background:#12382a;
  color:var(--green);
  border:1px solid var(--green);
  border-radius:8px;
  font-size:9px;
  padding:0 5px;
}

.mn{
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--white);
  border-radius:10px;
  font-size:20px;
}

#bd{
  position:relative;
  display:grid;
  grid-template:
    1.3fr repeat(9,1fr) 1.3fr /
    1.5fr repeat(9,1fr) 1.5fr;
  gap:2px;
  padding:16px;
  border:1px dashed var(--line);
  border-radius:12px;
  aspect-ratio:1/1.36!important;
  background:var(--bdimg,none) center/cover no-repeat,
             var(--bdbg,#0a1530)!important;
}

.t{
  position:relative;
  min-width:0;
  min-height:0;
  cursor:pointer;
}

.in{
  position:absolute;
  inset:0;
  background:var(--b,#fff);
  border-radius:5px;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:2px;
  overflow:hidden;
  padding:1px;
  text-align:center;
}

.top .in,
.bot .in{
  flex-direction:column;
}

.lf .in,
.rt .in{
  flex-direction:row;
}

.em{
  font-size:clamp(12px,4.2vw,20px);
  line-height:1;
}

.nm{
  font-size:clamp(5px,1.7vw,8px);
  font-weight:800;
  line-height:1;
  word-break:break-word;
}

.top .nm,
.bot .nm{
  writing-mode:vertical-rl;
}

.pr{
  position:absolute;
  background:var(--g);
  color:#fff;
  font-size:clamp(6px,2vw,9px);
  font-weight:800;
  padding:1px 4px;
  border-radius:3px;
  white-space:nowrap;
}

.top .pr{
  top:-13px;
  left:50%;
  transform:translateX(-50%);
}

.bot .pr{
  bottom:-13px;
  left:50%;
  transform:translateX(-50%);
}

.lf .pr{
  left:-15px;
  top:50%;
  transform:translateY(-50%) rotate(-90deg);
}

.rt .pr{
  right:-15px;
  top:50%;
  transform:translateY(-50%) rotate(90deg);
}

.st{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  text-align:center;
  font-size:8px;
  color:#f5a800;
  line-height:1;
  text-shadow:0 0 2px #000;
}

.tk{
  position:absolute;
  top:0;
  right:0;
  display:flex;
  flex-wrap:wrap;
  gap:1px;
  z-index:2;
}

.tk s{
  width:clamp(14px,4vw,18px);
  height:clamp(14px,4vw,18px);
  border-radius:50%;
  border:2px solid var(--c);
  background:#16264a;
  font-size:9px;
  display:grid;
  place-items:center;
  text-decoration:none;
  z-index:5;
  box-shadow:0 1px 4px rgba(0,0,0,.5);
}

.sp .in{
  background:var(--tile,#fff);
}

.sp .em{
  font-size:clamp(16px,6vw,28px);
}

#mid{
  grid-area:2/2/11/11;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:6px;
  display:flex;
  flex-direction:column;
  gap:5px;
  min-height:0;
  margin:4px;
}

#mid h3{
  margin:0;
  font-size:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.hb{
  display:flex;
  gap:4px;
  align-items:center;
}

.ib{
  border:1px solid var(--line);
  background:#0a1530;
  color:var(--white);
  border-radius:8px;
  padding:2px 7px;
  font-size:11px;
}

#log{
  flex:1;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:5px;
  min-height:0;
  border-top:1px solid var(--line);
  padding-top:4px;
}

.ev{
  font-size:12.5px;
  line-height:1.3;
  padding:0 4px;
}

.ev b{
  color:var(--c);
}

.ev.c{
  border-left:3px solid var(--c);
  background:#0a1530;
  border-radius:6px;
  padding:3px 8px;
}

.ev.c b{
  display:block;
  font-size:11px;
}

.row{
  display:flex;
  gap:4px;
}

.row input{
  flex:1;
  min-width:0;
  background:#0a1530;
  border:1px solid var(--line);
  border-radius:8px;
  color:var(--white);
  padding:6px 8px;
  font-size:12px;
}

button{
  font-size:12px;
  font-weight:700;
  border-radius:8px;
  background:#2f6fe0;
  color:#fff;
  padding:7px 10px;
}

button.y{
  background:var(--green);
  color:#042;
}

button.n{
  background:#3a4770;
}

#sc{
  background:#0a1530;
  border:1px solid var(--line);
  border-radius:10px;
  padding:7px 9px;
}

#sc b{
  font-size:15px;
  display:block;
}

#sc small{
  color:var(--muted);
  font-size:11px;
}

#sc .ac{
  display:flex;
  gap:5px;
  margin-top:6px;
}

#sc .ac button{
  flex:1;
}

.lg{
  max-width:92%;
  max-height:60%;
  object-fit:contain;
}

.lf .lg,
.rt .lg{
  max-width:80%;
  max-height:90%;
}

.ov{
  position:fixed;
  inset:0;
  background:rgba(2,6,18,.78);
  display:grid;
  place-items:center;
  z-index:50;
  padding:16px;
}

.md{
  width:100%;
  max-width:440px;
  background:linear-gradient(#142450,#0b1530);
  border:1px solid #2b3f7a;
  border-radius:24px;
  padding:16px;
}

.mh{
  display:flex;
  gap:12px;
  align-items:center;
}

.mh .x{
  margin-left:auto;
  border-radius:50%;
  width:36px;
  height:36px;
  padding:0;
  background:#0a1530;
  border:1px solid var(--line);
}

.gd{
  color:#e6b800;
  font-weight:700;
  letter-spacing:1px;
  font-size:11px;
}

.md h2{
  margin:2px 0;
  font-size:22px;
}

.mm{
  color:var(--green);
  font-weight:800;
  font-size:18px;
}

.mi{
  display:flex;
  gap:12px;
  align-items:center;
  border-radius:14px;
  padding:12px;
  margin-top:10px;
  border:1px solid;
}

.mi i{
  font-style:normal;
  font-size:26px;
  width:46px;
  height:46px;
  flex:none;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.08);
}

.mi b{
  font-size:16px;
  display:block;
}

.mi small{
  color:var(--muted);
}

.gold{
  background:#2a2418;
  border-color:#7a6320;
}

.grn{
  background:#0f2f2a;
  border-color:#1f7a5a;
}

.red{
  background:#2a1520;
  border-color:#7a2040;
}

.stt{
  margin-top:8px;
  font-size:13px;
  background:#0a1530;
  border-radius:10px;
  padding:8px;
}

.cb{
  display:flex;
  gap:6px;
  margin-top:6px;
}

#dz{
  position:fixed;
  inset:0;
  display:none;
  place-items:center;
  z-index:40;
  pointer-events:none;
  background:rgba(2,6,18,.45);
}

.dw{
  display:flex;
  gap:24px;
}

.dd{
  will-change:transform;
}

.die{
  width:84px;
  height:84px;
  background:var(--dimg,none) center/cover no-repeat,var(--dbg,#fff);
  border-radius:18px;
  display:grid;
  grid-template:repeat(3,1fr)/repeat(3,1fr);
  padding:11px;
  gap:2px;
  box-shadow:
    0 10px 28px rgba(0,0,0,.55),
    inset 0 -4px 0 rgba(0,0,0,.12);
}

.die i{
  display:block;
  border-radius:50%;
}

.die i.p{
  background:var(--dpip,#111);
  box-shadow:var(--dglow,none);
}

.dd.roll{
  animation:tmb 1s cubic-bezier(.3,.7,.4,1);
}

.dd.d2.roll{
  animation-name:tmb2;
  animation-delay:.07s;
}

.dd.pop{
  animation:pop .35s ease-out;
}

@keyframes tmb{
  0%{transform:translate(-90px,-260px) rotate(0) scale(.5);opacity:0}
  15%{opacity:1}
  45%{transform:translate(10px,0) rotate(260deg) scale(1.15)}
  60%{transform:translate(0,-60px) rotate(400deg) scale(1.05)}
  78%{transform:translate(0,0) rotate(560deg) scale(1)}
  90%{transform:translate(0,-16px) rotate(680deg)}
  100%{transform:translate(0,0) rotate(720deg)}
}

@keyframes tmb2{
  0%{transform:translate(90px,-260px) rotate(0) scale(.5);opacity:0}
  15%{opacity:1}
  45%{transform:translate(-10px,0) rotate(-300deg) scale(1.15)}
  60%{transform:translate(0,-60px) rotate(-440deg) scale(1.05)}
  78%{transform:translate(0,0) rotate(-600deg) scale(1)}
  90%{transform:translate(0,-16px) rotate(-700deg)}
  100%{transform:translate(0,0) rotate(-720deg)}
}

@keyframes pop{
  0%{transform:scale(1)}
  50%{transform:scale(1.18)}
  100%{transform:scale(1)}
}

.sum{
  position:absolute;
  top:calc(50% + 84px);
  font-size:28px;
  font-weight:800;
  color:#ffd23f;
  text-shadow:0 2px 10px #000;
  opacity:0;
}

.sum.on{
  opacity:1;
}

.fab{
  position:fixed;
  left:50%;
  bottom:calc(26px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);
  z-index:30;
  padding:16px 30px;
  font-size:18px;
  border-radius:999px;
  background:linear-gradient(#ffd23f,#e6a800);
  color:#201500;
  box-shadow:0 6px 26px rgba(255,200,0,.5);
  animation:fp 1.4s infinite;
}

@keyframes fp{
  0%,100%{transform:translateX(-50%) scale(1)}
  50%{transform:translateX(-50%) scale(1.06)}
}

.tk s{
  transition:
    transform .35s cubic-bezier(.34,1.4,.64,1),
    opacity .25s;
  animation:tokIn .4s cubic-bezier(.34,1.4,.64,1);
}

@keyframes tokIn{
  0%{transform:scale(0) translateY(-8px);opacity:0}
  70%{transform:scale(1.15)}
  100%{transform:scale(1) translateY(0);opacity:1}
}

.tk s.moving{
  animation:tokHop .55s ease-out;
}

@keyframes tokHop{
  0%{transform:scale(.6) translateY(-20px);opacity:.5}
  50%{transform:scale(1.2) translateY(-6px)}
  100%{transform:scale(1) translateY(0);opacity:1}
}

.tk s.tkn{
  animation:none;
}

.tk s.hop{
  animation:stepHop .16s ease-out;
}

@keyframes stepHop{
  0%{transform:translateY(-7px) scale(1.25)}
  100%{transform:translateY(0) scale(1)}
}

.tc{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.tcol{
  flex:1;
  min-width:0;
  background:#0a1530;
  border:1px solid var(--line);
  border-radius:12px;
  padding:8px;
}

.tcol>b{
  font-size:13px;
  display:block;
  margin-bottom:6px;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  max-height:34vh;
  overflow:auto;
}

.chip{
  font-size:11px;
  padding:4px 6px;
  border-radius:8px;
  background:#16264a;
  border:1px solid var(--line);
}

.chip.on{
  background:#1f7a5a;
  border-color:#2ee67a;
}

.chip.dis{
  opacity:.4;
}

.cash{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:8px;
  font-size:13px;
}

.cash button{
  padding:4px 12px;
}

.tbar{
  display:flex;
  gap:8px;
  align-items:center;
  justify-content:space-between;
  background:#2a2418;
  border:1px solid #7a6320;
  border-radius:10px;
  padding:6px 10px;
  margin:0 0 8px;
  font-size:12px;
}

.tbar button{
  padding:4px 10px;
}

.stats-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:12px 0;
}

.stat-card{
  background:#0a1530;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 6px;
  text-align:center;
}

.stat-card .si{
  font-size:20px;
}

.stat-card .sv{
  font-size:16px;
  font-weight:800;
  color:#ffd23f;
  margin:4px 0;
}

.stat-card .sl{
  font-size:10px;
  color:var(--muted);
  letter-spacing:.5px;
}

.skg{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:8px 0 14px;
}

.sk{
  text-align:center;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 4px 6px;
  background:#0a1530;
}

.sk.on{
  border-color:var(--green);
  background:#0f2f2a;
}

.sk .die,
.sk .av{
  margin:0 auto 6px;
}

.die.mini{
  width:44px;
  height:44px;
  padding:6px;
  border-radius:10px;
  gap:1px;
}

.sk small{
  font-size:11px;
  color:var(--muted);
}

.rowm{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 8px;
  font-size:14px;
  text-align:left;
}

.rowm span{
  flex:none;
}

.rowm select{
  flex:1;
  min-width:0;
  background:#0a1530;
  color:var(--white);
  border:1px solid var(--line);
  border-radius:10px;
  font-size:15px;
  padding:10px;
}

.ticon{
  flex:none;
  width:56px;
  height:56px;
  border-radius:14px;
  background:#fff;
  display:grid;
  place-items:center;
  font-size:28px;
  overflow:hidden;
  padding:4px;
}

.ticon img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}

.rtb{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

.rtb td{
  padding:7px 4px;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

.rtb td:last-child{
  text-align:right;
  font-weight:700;
  white-space:nowrap;
}

.dotg{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  margin-right:4px;
}

.thm{
  height:44px;
  border-radius:10px;
  border:1px solid var(--line);
  display:flex;
  gap:3px;
  align-items:flex-end;
  justify-content:center;
  padding:5px;
  margin:0 auto 6px;
}

.thm span{
  width:14px;
  height:14px;
  border-radius:3px;
}

#acts{
  min-height:64px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px 0;
}

#acts .fab{
  position:static;
  transform:none;
  padding:12px 28px;
  font-size:17px;
  white-space:nowrap;
  animation:fp2 1.4s infinite;
}

@keyframes fp2{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.05)}
}

#acts .buybar{
  position:static;
  transform:none;
  width:100%;
  max-width:480px;
}

.buybar{
  position:fixed;
  left:50%;
  bottom:calc(20px + env(safe-area-inset-bottom,0));
  transform:translateX(-50%);
  z-index:30;
  display:flex;
  gap:8px;
  width:min(360px,92%);
}

.buybar button{
  flex:1;
  padding:14px 12px;
  font-size:15px;
  border-radius:14px;
}

.tl{
  display:none;
  margin-top:6px;
  padding:6px 10px;
  border-radius:8px;
  background:#16306a;
  color:#cfe0ff;
  font-size:13px;
  font-weight:600;
}

.tl.on{
  display:block;
}

.toast{
  position:fixed;
  top:calc(12px + env(safe-area-inset-top,0));
  left:50%;
  transform:translateX(-50%) translateY(-20px);
  z-index:100;
  background:rgba(20,30,60,.95);
  border:1px solid #3a5a9a;
  color:var(--white);
  padding:10px 18px;
  border-radius:14px;
  font-size:14px;
  font-weight:600;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s,transform .25s;
  max-width:90%;
  text-align:center;
  box-shadow:0 8px 28px rgba(0,0,0,.45);
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}


/* =========================================================
   LOBBY — НОВИЙ ДИЗАЙН
========================================================= */

#lobby{
  position:relative;
  width:100%;
  max-width:480px;
  min-height:100vh;
  margin:0 auto;
  padding:
    calc(12px + env(safe-area-inset-top,0))
    16px
    calc(34px + env(safe-area-inset-bottom,0));
  text-align:center;
  overflow:hidden;

  background:
    radial-gradient(
      ellipse at 50% 8%,
      rgba(54,116,190,.45) 0%,
      transparent 38%
    ),
    radial-gradient(
      ellipse at 0% 100%,
      rgba(255,205,55,.10) 0%,
      transparent 35%
    ),
    linear-gradient(
      180deg,
      #0b1c39 0%,
      #071329 42%,
      #040a17 100%
    );
